<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GANBARU SHEET PRO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f8fafc;
  padding:10px;
}

#board {
  display:grid;
  grid-template-columns:repeat(10, 1fr);
  gap:4px;
  background:white;
  padding:10px;
  border:2px solid #ddd;
}

.cell {
  width:100%;
  aspect-ratio:1/1;
  border:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  background:white;
}

#ganbaruSheet {
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(10, 1fr);
  gap:4px;
}

.sheet-box {
  border:1px solid #ddd;
  background:white;
  text-align:center;
  padding:2px;
}

.sheet-top {
  font-weight:bold;
  color:red;
}

.sheet-bottom {
  font-size:0.7em;
  color:#999;
}
</style>
</head>

<body>

<h3>成約入力</h3>

<select id="staffSelect">
  <option>山田</option>
  <option>佐藤</option>
  <option>鈴木</option>
</select>

<label>
<input type="checkbox" id="handoverCheck"> 引き継ぎ
</label>

<select id="handoverFromSelect">
  <option>山田</option>
  <option>佐藤</option>
  <option>鈴木</option>
</select>

<button onclick="submitSuccess()">追加</button>
<button onclick="clearGanbaruSheet()">引き継ぎOFF（頑張るシート消去）</button>

<h3>ボード</h3>
<div id="board"></div>

<h3>頑張るシート</h3>
<div id="ganbaruSheet"></div>

<script>
// ===== 成約追加 =====
function submitSuccess() {
  const staffName = document.getElementById("staffSelect").value;
  const isHandover = document.getElementById("handoverCheck").checked;
  const handoverFrom = document.getElementById("handoverFromSelect").value;

  addSuccess(staffName, isHandover, handoverFrom);
}


// ===== 核心処理（修正版） =====
function addSuccess(staffName, isHandover=false, handoverFrom=null) {
  const board = document.getElementById("board");

  const cell = document.createElement("div");
  cell.className = "cell";

  // 通常成約（A）
  if (!isHandover) {
    cell.textContent = staffName;
    cell.style.color = "black";
    board.appendChild(cell);
    return;
  }

  // ===== 引き継ぎ成約 =====
  // ★ マス内は「引き継ぎ元」＋成：
  cell.textContent = "成：" + handoverFrom;
  cell.style.color = "red";
  board.appendChild(cell);

  // ===== 頑張るシート =====
  const sheet = document.getElementById("ganbaruSheet");

  const wrapper = document.createElement("div");
  wrapper.className = "sheet-box";

  // 上段：引き継ぎ元（赤 成：）
  const top = document.createElement("div");
  top.className = "sheet-top";
  top.textContent = "成：" + handoverFrom;

  // 下段：登録者（小文字グレー）
  const bottom = document.createElement("div");
  bottom.className = "sheet-bottom";
  bottom.textContent = staffName;

  wrapper.appendChild(top);
  wrapper.appendChild(bottom);
  sheet.appendChild(wrapper);
}


// ===== 引き継ぎOFF時：頑張るシート空白 =====
function clearGanbaruSheet() {
  document.getElementById("ganbaruSheet").innerHTML = "";
}
</script>

</body>
</html>
