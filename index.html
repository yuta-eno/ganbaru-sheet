<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  margin: 0;
  padding: 10px;
}

button {
  padding: 10px 14px;
  margin: 5px;
  font-size: 14px;
  cursor: pointer;
}

.panel {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* 🔥クリック遮断防止 */
.overlay, .fixed-panel {
  pointer-events: none;
}
button, input, select {
  pointer-events: auto;
}
</style>
</head>

<body>

<div class="panel">
  <select id="staffSelect"></select>
  <select id="itemSelect"></select>
  <button onclick="addSale()">追加</button>
</div>

<div class="panel">
  <h3>今日のボード</h3>
  <div id="board"></div>
</div>

<div class="panel">
  <h3>月間集計</h3>
  <input type="date" id="monthPick">
  <button onclick="loadMonthly()">表示</button>
  <div id="monthly"></div>
</div>

<script>
/* ===== Firebase ===== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ===== data ===== */
let staffList = [];
let itemList = [];
let sales = [];

/* ===== 初期ロード ===== */
window.onload = async function() {
  await loadSettings();
  await loadToday();
};

/* ===== 設定ロード ===== */
async function loadSettings() {
  const snap = await db.collection("settings").get();
  staffList = [];
  itemList = [];

  snap.forEach(d => {
    const v = d.data();
    if (v.type === "staff") staffList.push({id:d.id, ...v});
    if (v.type === "item") itemList.push({id:d.id, ...v});
  });

  staffList.sort((a,b)=>a.order-b.order);
  itemList.sort((a,b)=>a.order-b.order);

  renderSelects();
}

/* ===== select描画 ===== */
function renderSelects() {
  const ss = document.getElementById("staffSelect");
  const is = document.getElementById("itemSelect");
  ss.innerHTML = "";
  is.innerHTML = "";

  staffList.forEach(s=>{
    const o = document.createElement("option");
    o.value = s.name;
    o.textContent = s.name;
    ss.appendChild(o);
  });

  itemList.forEach(i=>{
    const o = document.createElement("option");
    o.value = i.name;
    o.textContent = i.name;
    is.appendChild(o);
  });
}

/* ===== 今日データ ===== */
async function loadToday() {
  const today = new Date().toISOString().slice(0,10);
  const snap = await db.collection("sales").where("date","==",today).get();
  sales = [];
  snap.forEach(d=>sales.push(d.data()));
  renderBoard();
}

/* ===== ボード描画 ===== */
function renderBoard() {
  const b = document.getElementById("board");
  b.innerHTML = "";
  sales.forEach(s=>{
    const div = document.createElement("div");
    div.textContent = s.staff + " : " + s.item;
    b.appendChild(div);
  });
}

/* ===== 追加 ===== */
async function addSale() {
  const staff = staffSelect.value;
  const item = itemSelect.value;
  const date = new Date().toISOString().slice(0,10);

  await db.collection("sales").add({staff,item,date});
  loadToday();
}

/* ===== 月間 ===== */
async function loadMonthly() {
  const d = document.getElementById("monthPick").value;
  if(!d) return alert("日付選んで");

  const y = d.split("-")[0];
  const m = d.split("-")[1];

  const start = y+"-"+m+"-01";
  const end = y+"-"+m+"-31";

  const snap = await db.collection("sales")
    .where("date",">=",start)
    .where("date","<=",end)
    .get();

  const map = {};
  snap.forEach(doc=>{
    const v = doc.data();
    const k = v.staff + "_" + v.item;
    map[k] = (map[k]||0)+1;
  });

  const div = document.getElementById("monthly");
  div.innerHTML = "";
  Object.keys(map).forEach(k=>{
    const d = document.createElement("div");
    d.textContent = k + " : " + map[k];
    div.appendChild(d);
  });
}
</script>

</body>
</html>
