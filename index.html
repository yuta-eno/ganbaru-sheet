<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
/* ===== UI 見栄え ===== */
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f4f6; }

/* Tabs */
header{ display:flex; gap:10px; padding:8px; background:white; border-bottom:1px solid #ddd; }
.tab{ padding:6px 14px; border-radius:8px; cursor:pointer; background:#e5e7eb; font-weight:bold; color:#64748b;}
.tab.active{background:#2563eb;color:white;}

.page{display:none;padding:12px; max-width:1200px; margin:0 auto;}
.page.active{display:block;}

/* Cards */
.card{ background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:15px; }
.card h3 { margin-top:0; border-bottom:2px solid #e2e8f0; padding-bottom:8px; color:#334155; margin-bottom:15px; }

/* Staff selector & Lock */
.staff-selector { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:bold; color:#475569; }
.staff-selector select { font-size:16px; padding:10px; flex:1; min-width:150px; max-width:300px; border-radius:8px; border:1px solid #cbd5e0; background:#f8fafc; }
#lockBtn { padding:10px 15px; border:1px solid #cbd5e0; background:#f1f5f9; color:#64748b; border-radius:8px; cursor:pointer; font-weight:bold; white-space:nowrap; transition:0.3s; }
#lockBtn.locked { background:#3b82f6; color:white; border-color:#2563eb; }

/* ★引き継ぎボタン */
#handoverBtn{
 padding:10px 15px;
 border:1px solid #cbd5e0;
 background:#f1f5f9;
 color:#64748b;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold;
 transition:0.3s;
}
#handoverBtn.on{
 background:#22c55e;
 color:white;
 border-color:#16a34a;
}

/* Input buttons */
.items{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.item-box{ border:1px solid #ddd; border-radius:10px; padding:8px; background:white; }
.item-btn{ width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; color:white; cursor:pointer; 
 text-shadow: 1px 1px 0 rgba(0,0,0,0.6), -1px -1px 0 rgba(0,0,0,0.6), 1px -1px 0 rgba(0,0,0,0.6), -1px 1px 0 rgba(0,0,0,0.6), 0px 2px 4px rgba(0,0,0,0.5);}
.item-btn:active{opacity:0.7;}
.item-footer{ display:flex; justify-content:space-between; margin-top:6px; font-size:14px; align-items:center;}
.my-count { font-size:16px; font-weight:bold; color:#475569; }
.minus{ background:#f1f5f9; color:#64748b; border:1px solid #e2e8f0; padding:4px 10px; border-radius:6px; font-weight:bold; cursor:pointer; }
.rank-mini{ font-size:12px; color:#64748b; margin-top:4px; }

/* ★入力商材ボタン文字を白縁黒文字 */
.item-btn{
 color:#000 !important;
 text-shadow:
 1px 1px 0 #fff,
 -1px -1px 0 #fff,
 1px -1px 0 #fff,
 -1px 1px 0 #fff,
 0px 2px 4px rgba(0,0,0,0.2);
}

/* Board Table */
.board-wrap{ overflow-x:auto; padding-bottom:10px; }
table{ border-collapse:collapse; width:max-content; background:white; }
th,td{ border:1px solid #cbd5e0; padding:4px; text-align:center; font-size:12px; }
.row-header { position:sticky; left:0; z-index:1; border-right:2px solid #cbd5e0; font-weight:bold; white-space:nowrap; padding:8px 12px; background:#f8fafc;}
.square{ width:45px; height:45px; overflow:hidden; font-size:11px; background:#fff; vertical-align:middle; }
.square-cell { min-width: 45px; }
.name-cell { background:#e0f2fe; color:#0369a1; font-weight:bold; }

/* Settings */
.settings-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
@media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }

/* ★目標表示 */
.goal-box{
 background:linear-gradient(135deg,#fde047,#f97316);
 padding:15px;
 border-radius:12px;
 color:#000;
 font-weight:bold;
 box-shadow:0 4px 10px rgba(0,0,0,0.2);
 margin-bottom:10px;
}
.goal-progress{
 background:white;
 height:14px;
 border-radius:8px;
 overflow:hidden;
 margin-top:6px;
}
.goal-bar{
 height:100%;
 background:#22c55e;
}
</style>
</head>

<body>

<header>
 <div class="tab active" onclick="showTab('input')">入力</div>
 <div class="tab" onclick="showTab('board')">がんばるシート</div>
 <div class="tab" onclick="showTab('settings')">設定</div>
</header>

<div id="input" class="page active">

<div class="card">
 <div class="staff-selector">
  <label>スタッフ:</label>
  <select id="staffSelect"></select>
  <button onclick="toggleLock()" id="lockBtn">🔓 固定OFF</button>

  <!-- ★追加 -->
  <button onclick="toggleHandover()" id="handoverBtn">🔁 引き継ぎOFF</button>
 </div>
</div>

<div class="card">
 <div class="items" id="btnContainer"></div>
</div>

<div class="card" id="goalDisplay"></div>

</div>

<div id="board" class="page">
 <div class="card">
  <h3 id="boardTitle">本日の成約ボード</h3>
  <div class="board-wrap">
   <table id="boardTable"></table>
  </div>
 </div>
</div>

<div id="settings" class="page">
<div class="settings-grid">
 <div class="card">
  <h3>スタッフ管理</h3>
  <div class="add-form">
   <input type="text" id="newStaff" placeholder="名前">
   <button onclick="addStaff()">追加</button>
  </div>
  <div id="staffListUI"></div>
 </div>

 <div class="card">
  <h3>商材管理</h3>
  <div class="add-form">
   <input type="text" id="newItem" placeholder="新商材">
   <input type="color" id="newColor" value="#e0f2fe">
   <button onclick="addItem()">追加</button>
  </div>
  <div id="itemListUI"></div>
 </div>
</div>

<div class="card">
 <h3>今日の目標設定</h3>
 <div id="goalPanel"></div>
</div>
</div>

<script>
/* ================= Firebase ================= */
const firebaseConfig={
 apiKey: "AIzaSyCmerraKVr1iJsRoiW53lxUtgDUcOGVXtY",
 authDomain: "ganbaru-sheet-a32f3.firebaseapp.com",
 projectId: "ganbaru-sheet-a32f3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ================= Tabs ================= */
const ADMIN_PASSWORD = "0000";

function showTab(id){
 if(id === 'settings') {
  const pass = prompt("管理用パスワードを入力してください:");
  if(pass !== ADMIN_PASSWORD) {
   if(pass !== null) alert("パスワードが違います。");
   return;
  }
 }
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 event.target.classList.add("active");
}

/* ================= Data ================= */
let staffList=[],itemList=[],records=[];
const today = new Date();
const dateStr = `${today.getMonth() + 1}/${today.getDate()}`;
document.getElementById('boardTitle').textContent = `${dateStr} のがんばるシート`;

db.collection("settings").orderBy("order", "asc").onSnapshot(snap=>{
 staffList=[];itemList=[];
 snap.forEach(d=>{
  const v=d.data();v.id=d.id;
  if(v.type=="staff") staffList.push(v);
  if(v.type=="item") itemList.push(v);
 });
 renderAll();
});

db.collection("sales").onSnapshot(snap=>{
 records=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderAll();
});

/* ================= UI Render ================= */
const staffSelect=document.getElementById("staffSelect");
const btnContainer=document.getElementById("btnContainer");
const boardTable=document.getElementById("boardTable");

/* Staff Lock */
let lockedStaff=localStorage.getItem("lockedStaff")||"";

/* ★引き継ぎモード */
let handoverMode = localStorage.getItem("handoverMode") === "true";

function toggleLock(){
 if(lockedStaff){
  lockedStaff="";
  localStorage.removeItem("lockedStaff");
 }else{
  lockedStaff=staffSelect.value;
  localStorage.setItem("lockedStaff",lockedStaff);
 }
 renderAll();
}

/* ★引き継ぎON/OFF */
function toggleHandover(){
 handoverMode = !handoverMode;
 localStorage.setItem("handoverMode", handoverMode);
 renderAll();
}

function renderAll(){
 staffSelect.innerHTML=staffList.map(s=>`<option>${s.name}</option>`).join("");

 if(lockedStaff){
  staffSelect.value=lockedStaff;

  /* ★変更：引き継ぎONのみ変更可 */
  staffSelect.disabled = !handoverMode;

  document.getElementById('lockBtn').textContent="🔒 固定ON";
  document.getElementById('lockBtn').classList.add("locked");
 }else{
  staffSelect.disabled=false;
  document.getElementById('lockBtn').textContent="🔓 固定OFF";
  document.getElementById('lockBtn').classList.remove("locked");
 }

 /* 引き継ぎ表示 */
 const hb=document.getElementById("handoverBtn");
 if(handoverMode){
  hb.textContent="🔁 引き継ぎON";
  hb.classList.add("on");
 }else{
  hb.textContent="🔁 引き継ぎOFF";
  hb.classList.remove("on");
 }

 btnContainer.innerHTML=itemList.map(it=>`
 <div class="item-box">
  <button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
  <div class="item-footer">
   <span class="my-count" id="count_${it.name}">0件</span>
   <button class="minus" onclick="removeRecord('${it.name}')">− 取消</button>
  </div>
 </div>`).join("");

 updateCounts();
 renderBoard();
 renderGoalsOnInput();
}

/* ================= Sales ================= */
function addRecord(item){
 const staff=lockedStaff||staffSelect.value;
 const date=new Date().toISOString().slice(0,10);
 db.collection("sales").add({staff,item,date, enteredBy:lockedStaff||staff, handover:handoverMode});
}
function removeRecord(item){
 const staff=lockedStaff||staffSelect.value;
 const today=new Date().toISOString().slice(0,10);
 const r=records.filter(r=>r.item==item&&r.staff==staff&&r.date==today).pop();
 if(r) db.collection("sales").doc(r.id).delete();
}

/* ================= Counts ================= */
function updateCounts(){
 const today=new Date().toISOString().slice(0,10);
 const staff=lockedStaff||staffSelect.value;

 itemList.forEach(it=>{
  const c=records.filter(r=>r.item==it.name&&r.staff==staff&&r.date==today).length;
  const countEl = document.getElementById("count_"+it.name);
  if(countEl) countEl.textContent=c+"件";
 });
}

/* ================= Board ================= */
function renderBoard(){
 const today=new Date().toISOString().slice(0,10);
 let maxCols = 20;

 itemList.forEach(it=>{
  const count = records.filter(r=>r.item==it.name&&r.date==today).length;
  if(count > maxCols) maxCols = count;
 });

 let html="<tr><th>商材名</th><th>合計</th>";
 for(let i=1; i<=maxCols; i++) html+=`<th>${i}</th>`;
 html+="</tr>";

 itemList.forEach(it=>{
  const itemRecords = records.filter(r=>r.item==it.name&&r.date==today);
  html+=`<tr><th>${it.name}</th><td>${itemRecords.length}</td>`;
  for(let i=0;i<maxCols;i++){
   html+=`<td>${itemRecords[i]?itemRecords[i].staff:""}</td>`;
  }
  html+="</tr>";
 });
 boardTable.innerHTML=html;
}

/* ================= Goals ================= */
let goals = {};
db.collection("goals").onSnapshot(snap=>{
 goals={};
 snap.forEach(d=>goals[d.data().item]=d.data());
 renderGoalsOnInput();
});

function renderGoalsOnInput(){
 const box=document.getElementById("goalDisplay");
 if(!box) return;
 const today=new Date().toISOString().slice(0,10);

 box.innerHTML=itemList.map(it=>{
  const target=goals[it.name]?.target||0;
  if(!target) return "";
  const current=records.filter(r=>r.item==it.name&&r.date==today).length;
  const pct=Math.min(100, Math.round(current/target*100));

  return `
  <div class="goal-box">
   🔥 ${it.name} 目標 ${target}件 / 現在 ${current}件 (${pct}%)
   <div class="goal-progress">
    <div class="goal-bar" style="width:${pct}%"></div>
   </div>
  </div>`;
 }).join("");
}
</script>

</body>
</html>
