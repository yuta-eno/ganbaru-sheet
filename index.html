<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>がんばるシート</title>

<style>
body { font-family: Arial, sans-serif; background:#f0fdf4; margin:0; }
.container { max-width:1200px; margin:auto; padding:15px; }

.tab-menu { display:flex; background:white; border-bottom:2px solid #e2e8f0; }
.tab-menu button { flex:1; padding:12px; border:none; font-weight:bold; cursor:pointer; background:none; }
.tab-menu button.active { border-bottom:3px solid #3b82f6; background:#eff6ff; }

.tab-content { display:none; background:white; padding:15px; border-radius:10px; margin-top:10px; }
.tab-content.active { display:block; }

.btn-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.item-card { border:1px solid #e2e8f0; border-radius:10px; overflow:hidden; }
.item-card button { width:100%; border:none; padding:15px; font-weight:bold; cursor:pointer; }
.count-area { display:flex; justify-content:space-between; padding:5px 10px; font-size:14px; }

table { border-collapse:collapse; }
th,td { border:1px solid #ccc; width:50px; height:50px; text-align:center; font-size:12px; }
.row-header { background:#f8fafc; font-weight:bold; position:sticky; left:0; }
.name-cell { background:#e0f2fe; font-weight:bold; }

.list-ui { list-style:none; padding:0; }
.list-ui li { background:white; padding:6px; margin-bottom:4px; display:flex; justify-content:space-between; border:1px solid #e2e8f0; border-radius:5px; }

.add-form { display:flex; gap:5px; }
.add-form input,select { padding:6px; }

.edit-btn { background:#3b82f6; color:white; border:none; padding:3px 6px; }
.delete-btn { background:#fecaca; border:none; padding:3px 6px; }
.move-btn { background:#f1f5f9; border:1px solid #cbd5e0; padding:3px 6px; }

#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
 background:#1e293b; color:white; padding:10px 20px; border-radius:20px; display:none; }
</style>
</head>

<body>

<div class="tab-menu">
<button id="tabBtnInput" class="active" onclick="switchTab('input')">実績入力</button>
<button id="tabBtnBoard" onclick="switchTab('board')">がんばるシート</button>
<button id="tabBtnSettings" onclick="switchTab('settings')">🔒 設定</button>
</div>

<div class="container">

<!-- 入力 -->
<div id="inputView" class="tab-content active">
<h2 id="inputDateTitle"></h2>

<select id="staffSelect"></select>
<div id="btnContainer" class="btn-grid"></div>
</div>

<!-- ボード -->
<div id="boardView" class="tab-content">
<h2 id="boardTitle"></h2>
<button onclick="exportToExcel()">Excel出力</button>
<div style="overflow-x:auto">
<table id="resultTable"></table>
</div>
</div>

<!-- 設定 -->
<div id="settingsView" class="tab-content">
<h3>スタッフ追加</h3>
<div class="add-form">
<input id="newStaffInput">
<button onclick="addListItem('staff')">追加</button>
</div>
<ul id="staffListUI" class="list-ui"></ul>

<h3>商材追加</h3>
<div class="add-form">
<input id="newItemInput">
<select id="newItemColor">
<option value="#bae6fd">水色</option>
<option value="#fef08a">黄色</option>
<option value="#bbf7d0">緑</option>
<option value="#e9d5ff">紫</option>
<option value="#fecdd3">ピンク</option>
<option value="#fed7aa">オレンジ</option>
<option value="#f1f5f9">グレー</option>
</select>
<button onclick="addListItem('item')">追加</button>
</div>
<ul id="itemListUI" class="list-ui"></ul>

<button onclick="clearTodayData()">本日データ全消去</button>
</div>

</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp, deleteDoc, doc, getDocs, setDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCmerraKVr1iJsRoiW53lxUtgDUcOGVXtY",
 authDomain: "ganbaru-sheet-a32f3.firebaseapp.com",
 projectId: "ganbaru-sheet-a32f3",
 storageBucket: "ganbaru-sheet-a32f3.appspot.com",
 messagingSenderId: "75251515079",
 appId: "1:75251515079:web:19acf818476d90588808e2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ADMIN_PASSWORD="0000";

let testData=[], staffNames=[], items=[];

const COLORS={
 blue:"#bae6fd", yellow:"#fef08a", green:"#bbf7d0", purple:"#e9d5ff",
 pink:"#fecdd3", orange:"#fed7aa", gray:"#f1f5f9"
};

const defaultItems=[
 {name:"光10GB",color:COLORS.blue},
 {name:"HOME5G",color:COLORS.blue},
 {name:"GOLD",color:COLORS.yellow},
 {name:"ドコモでんき",color:COLORS.green},
 {name:"守くん",color:COLORS.purple}
];

const today=new Date();
const dateStr=`${today.getMonth()+1}/${today.getDate()}`;
const searchDateStr=today.toLocaleDateString("ja-JP");

document.getElementById("boardTitle").textContent=`${dateStr} のがんばるシート`;
document.getElementById("inputDateTitle").textContent=`実績入力 (${dateStr})`;

// ===== Firestore監視 =====
onSnapshot(query(collection(db,"sales_records"),where("date","==",searchDateStr)),snap=>{
 testData=snap.docs.map(d=>({id:d.id,...d.data()}));
 updateView();
});

onSnapshot(query(collection(db,"settings"),orderBy("order")),snap=>{
 staffNames=snap.docs.filter(d=>d.data().type==="staff").map(d=>d.data().name);
 items=snap.docs.filter(d=>d.data().type==="item").map(d=>d.data());
 if(items.length===0) resetToDefaultItems();
 renderStaffSelect();
 buildInputUI();
 renderSettingsUI();
 updateView();
});

// ===== 初期商材登録 =====
async function resetToDefaultItems(){
 for(let i=0;i<defaultItems.length;i++){
  await setDoc(doc(db,"settings","item_"+i),{type:"item",order:i,...defaultItems[i]});
 }
}

// ===== UI =====
function renderStaffSelect(){
 const sel=document.getElementById("staffSelect");
 sel.innerHTML=staffNames.map(n=>`<option>${n}</option>`).join("");
}

function buildInputUI(){
 document.getElementById("btnContainer").innerHTML=items.map(it=>`
 <div class="item-card">
  <button style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
  <div class="count-area">
   <span id="count-${it.name}">0件</span>
   <button onclick="removeRecord('${it.name}')">取消</button>
  </div>
 </div>`).join("");
}

// ===== データ操作 =====
async function addRecord(item){
 const staff=document.getElementById("staffSelect").value;
 if(!staff) return alert("スタッフ選択");
 await addDoc(collection(db,"sales_records"),{staff,item,date:searchDateStr,timestamp:serverTimestamp()});
 showToast(`${staff}: ${item}+1`);
}

async function removeRecord(item){
 const staff=document.getElementById("staffSelect").value;
 const target=testData.filter(d=>d.staff===staff && d.item===item).pop();
 if(target) await deleteDoc(doc(db,"sales_records",target.id));
}

// ===== 設定追加 =====
window.addListItem=async(type)=>{
 const val=document.getElementById(type==="staff"?"newStaffInput":"newItemInput").value.trim();
 if(!val) return;
 const order=Date.now();
 const data={type,name:val,order};
 if(type==="item") data.color=document.getElementById("newItemColor").value;
 await setDoc(doc(db,"settings",`${type}_${order}`),data);
};

// ===== 表示更新 =====
function updateView(){
 const staff=document.getElementById("staffSelect").value;
 const board={};
 items.forEach(it=>board[it.name]=testData.filter(d=>d.item===it.name).map(d=>d.staff));
 const maxCols=Math.max(10,...items.map(it=>board[it.name].length));
 let html=`<thead><tr><th class="row-header">商材</th>${Array.from({length:maxCols},(_,i)=>`<th>${i+1}</th>`).join("")}</tr></thead><tbody>`;
 items.forEach(it=>{
  html+=`<tr><td class="row-header" style="background:${it.color}">${it.name}</td>`;
  for(let i=0;i<maxCols;i++){
   const name=board[it.name][i]||"";
   html+=`<td class="${name?"name-cell":""}">${name}</td>`;
  }
  html+="</tr>";
  const c=document.getElementById("count-"+it.name);
  if(c) c.textContent=testData.filter(d=>d.staff===staff&&d.item===it.name).length+"件";
 });
 document.getElementById("resultTable").innerHTML=html+"</tbody>";
}

// ===== Excel出力 =====
window.exportToExcel=()=>{
 const html=`<html><meta charset="utf-8"><table>${document.getElementById("resultTable").innerHTML}</table></html>`;
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([html],{type:"application/vnd.ms-excel"}));
 a.download=`${dateStr.replace("/","-")}.xls`;
 a.click();
};

// ===== 設定UI =====
function renderSettingsUI(){
 document.getElementById("staffListUI").innerHTML=staffNames.map(n=>`<li>${n}</li>`).join("");
 document.getElementById("itemListUI").innerHTML=items.map(it=>`<li style="border-left:5px solid ${it.color}">${it.name}</li>`).join("");
}

// ===== 便利機能 =====
window.clearTodayData=async()=>{
 if(!confirm("全消去?")) return;
 const snap=await getDocs(query(collection(db,"sales_records"),where("date","==",searchDateStr)));
 snap.forEach(d=>deleteDoc(doc(db,"sales_records",d.id)));
};

window.switchTab=(id)=>{
 if(id==="settings" && prompt("パスワード")!==ADMIN_PASSWORD) return;
 ["input","board","settings"].forEach(t=>{
  document.getElementById(t+"View").classList.toggle("active",t===id);
  document.getElementById("tabBtn"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("active",t===id);
 });
};

function showToast(m){
 const t=document.getElementById("toast");
 t.textContent=m;
 t.style.display="block";
 setTimeout(()=>t.style.display="none",2000);
}
</script>

</body>
</html>
