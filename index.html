<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
body { font-family: sans-serif; background:#f7fafc; margin:0; padding:10px; }
h2 { margin-top:20px; }
button { padding:8px 12px; margin:3px; border:none; background:#2563eb; color:white; border-radius:6px; }
table { border-collapse: collapse; width:100%; background:white; }
th,td { border:1px solid #ddd; padding:6px; text-align:center; }
th { background:#2563eb; color:white; }
.board { display:grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap:6px; }
.cell { background:white; border:1px solid #ddd; padding:10px; font-size:14px; }
</style>
</head>
<body>

<h1>🔥 GANBARU SHEET PRO</h1>

<!-- 入力 -->
<h2>📥 成約登録</h2>
スタッフ：
<select id="staff">
<option>山田</option>
<option>佐藤</option>
<option>鈴木</option>
<option>田中</option>
</select>

商材（複数可）：<br>
<label><input type="checkbox" class="product" value="光回線"> 光回線</label>
<label><input type="checkbox" class="product" value="モバイル"> モバイル</label>
<label><input type="checkbox" class="product" value="オプション"> オプション</label>
<label><input type="checkbox" class="product" value="でんき"> でんき</label>

<br><br>
<button onclick="saveData()">登録</button>

<hr>

<!-- ページ切替 -->
<button onclick="showPage('staffMonthly')">📊 月間スタッフ集計</button>
<button onclick="showPage('productMonthly')">🏆 商材TOP3</button>
<button onclick="showPage('productBoard')">📋 商材月間ボード</button>

<hr>

<!-- 月間スタッフ集計 -->
<div id="staffMonthly" style="display:none;">
<h2>📊 月間スタッフ別件数</h2>
<table id="staffTable">
<tr><th>スタッフ</th><th>件数</th></tr>
</table>
</div>

<!-- 商材月合計 TOP3 -->
<div id="productMonthly" style="display:none;">
<h2>🏆 商材別 月合計（TOP3）</h2>
<div id="productSummary"></div>
</div>

<!-- 商材月間累計ボード -->
<div id="productBoard" style="display:none;">
<h2>📋 商材 月間累計ボード</h2>
<table id="productBoardTable">
<tr><th>商材</th><th>月累計件数</th></tr>
</table>
</div>

<script>
// ===== Firebase =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== 保存 =====
function saveData(){
  const staff = document.getElementById("staff").value;
  const products = [...document.querySelectorAll(".product:checked")].map(e=>e.value);
  if(products.length==0){ alert("商材選択"); return; }

  db.collection("records").add({
    staff,
    products,
    date: new Date()
  }).then(()=>alert("登録完了"));
}

// ===== ページ切替 =====
function showPage(id){
  ["staffMonthly","productMonthly","productBoard"].forEach(p=>{
    document.getElementById(p).style.display="none";
  });
  document.getElementById(id).style.display="block";

  if(id=="staffMonthly") loadStaffMonthly();
  if(id=="productMonthly") loadProductMonthly();
  if(id=="productBoard") loadProductBoard();
}

// ===== 今月データ取得 =====
function getMonthRange(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(),1);
  const end = new Date(now.getFullYear(), now.getMonth()+1,1);
  return {start,end};
}

// ===== スタッフ月間集計 =====
function loadStaffMonthly(){
  const {start,end}=getMonthRange();
  db.collection("records").where("date",">=",start).where("date","<",end)
  .get().then(snap=>{
    const count={};
    snap.forEach(doc=>{
      const d=doc.data();
      count[d.staff]=(count[d.staff]||0)+1;
    });

    const table=document.getElementById("staffTable");
    table.innerHTML="<tr><th>スタッフ</th><th>件数</th></tr>";
    Object.keys(count).forEach(name=>{
      table.innerHTML+=`<tr><td>${name}</td><td>${count[name]}</td></tr>`;
    });
  });
}

// ===== 商材月合計 + TOP3 =====
function loadProductMonthly(){
  const {start,end}=getMonthRange();
  db.collection("records").where("date",">=",start).where("date","<",end)
  .get().then(snap=>{
    const count={};
    snap.forEach(doc=>{
      const d=doc.data();
      d.products.forEach(p=>{
        count[p]=(count[p]||0)+1;
      });
    });

    const sorted = Object.entries(count).sort((a,b)=>b[1]-a[1]);
    const div=document.getElementById("productSummary");
    div.innerHTML="<h3>合計</h3>";
    sorted.forEach(([p,c])=>{
      div.innerHTML+=`${p}: ${c}件<br>`;
    });

    div.innerHTML+="<h3>TOP3</h3>";
    sorted.slice(0,3).forEach(([p,c],i)=>{
      div.innerHTML+=`${i+1}位 ${p}: ${c}件<br>`;
    });
  });
}

// ===== 商材 月累計ボード =====
function loadProductBoard(){
  const {start,end}=getMonthRange();
  db.collection("records").where("date",">=",start).where("date","<",end)
  .get().then(snap=>{
    const count={};
    snap.forEach(doc=>{
      const d=doc.data();
      d.products.forEach(p=>{
        count[p]=(count[p]||0)+1;
      });
    });

    const table=document.getElementById("productBoardTable");
    table.innerHTML="<tr><th>商材</th><th>月累計件数</th></tr>";
    Object.keys(count).forEach(p=>{
      table.innerHTML+=`<tr><td>${p}</td><td>${count[p]}</td></tr>`;
    });
  });
}
</script>

</body>
</html>
