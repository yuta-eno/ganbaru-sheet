<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f4f6; }

/* Tabs */
header{ display:flex; gap:6px; padding:8px; background:white; border-bottom:1px solid #ddd; overflow-x:auto; }
.tab{ padding:8px 10px; border-radius:8px; cursor:pointer; background:#e5e7eb; font-weight:bold; color:#64748b; font-size:14px; flex:1; text-align:center; white-space:nowrap; min-width:80px;}
.tab.active{background:#2563eb;color:white;}

/* Date/Month Controller */
.date-controller { background:white; border-bottom:1px solid #ddd; padding:10px; display:flex; justify-content:center; gap:15px; align-items:center; }
.date-btn { padding:6px 12px; border:1px solid #cbd5e0; border-radius:6px; background:#f8fafc; font-weight:bold; cursor:pointer; color:#475569;}
.date-btn:active { background:#e2e8f0; }
.date-btn-today { background:#3b82f6; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;}
#dateDisplay, #monthDisplay { font-weight:bold; font-size:16px; color:#1e293b; min-width:130px; text-align:center; }

.page{display:none;padding:12px; max-width:1200px; margin:0 auto;}
.page.active{display:block;}

/* Cards */
.card{ background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:15px; }
.card h3 { margin-top:0; border-bottom:2px solid #e2e8f0; padding-bottom:8px; color:#334155; margin-bottom:15px; }
.full-width { grid-column: 1 / -1; }

/* Staff selector */
.staff-selector { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:bold; color:#475569; }
.staff-selector select { font-size:16px; padding:10px; flex:1; min-width:150px; max-width:300px; border-radius:8px; border:1px solid #cbd5e0; background:#f8fafc; }
#lockBtn { padding:10px 15px; border:1px solid #cbd5e0; background:#f1f5f9; color:#64748b; border-radius:8px; cursor:pointer; font-weight:bold; }
#lockBtn.locked { background:#3b82f6; color:white; }

/* 引き継ぎ UI */
.handoff-wrap { display:flex; align-items:center; gap:8px; padding-left:15px; margin-left:5px; border-left:2px solid #cbd5e0; }
.handoff-wrap select { font-size:16px; padding:8px; border-radius:8px; border:1px solid #cbd5e0; background:#f8fafc; }

/* Items */
.items{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.item-box{ border:1px solid #ddd; border-radius:10px; padding:8px; background:white; }
.item-btn{ 
  width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer;
  color:#000; text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 0px 2px 4px rgba(0,0,0,0.2);
}
.item-footer{ display:flex; justify-content:space-between; margin-top:6px; font-size:14px; align-items:center;}
.minus{ background:#f1f5f9; border:1px solid #e2e8f0; padding:4px 10px; border-radius:6px; font-weight:bold; cursor:pointer; }
.my-count { font-size:16px; font-weight:bold; color:#475569; }
.rank-mini { font-size:12px; color:#64748b; margin-top:4px; }

/* Board */
.board-wrap{ overflow-x:auto; }
table{ border-collapse:collapse; width:max-content; background:white; }
th,td{ border:1px solid #cbd5e0; padding:4px; text-align:center; font-size:12px; }
.row-header { position:sticky; left:0; z-index:1; font-weight:bold; background:#f8fafc; }
.square{ width:60px; height:60px; font-size:12px; background:#fff; vertical-align:middle; }
.name-cell{ background:#f0f9ff; }
.normal-name{ font-weight:bold; color:#000; }
.handoff-main{ font-weight:bold; color:#dc2626; } 
.handoff-sub{ font-size:10px; color:#64748b; }

/* Settings */
.settings-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
@media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
.add-form { display:flex; gap:8px; align-items:center; margin-bottom:15px; }
.add-form input[type="text"] { flex:1; min-width:0; padding:10px; border:1px solid #cbd5e0; border-radius:6px; font-size:14px; }
.add-form input[type="color"] { width:45px; height:40px; padding:2px; border:1px solid #cbd5e0; border-radius:6px; cursor:pointer; flex-shrink:0;}
.add-form button { padding:10px 15px; background:#64748b; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; flex-shrink:0;}
.list-ui { list-style:none; padding:0; margin:0; max-height:500px; overflow-y:auto; }
.list-ui li { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-bottom:1px solid #edf2f7; background:white; margin-bottom:4px; border-radius:6px; transition:0.2s;}
.drag-handle { cursor: grab; font-size: 18px; color: #94a3b8; padding: 0 4px; user-select: none; }
.drag-handle:active { cursor: grabbing; }
.list-ui li.dragging { opacity: 0.4; background: #f8fafc; border: 1px dashed #cbd5e0; }
.list-ui li.over { border-top: 3px solid #3b82f6; }
.delete-btn { background:#fca5a5; color:#7f1d1d; border:none; padding:8px 12px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:bold; flex-shrink:0;}
.setting-input { flex:1; min-width:50px; padding:8px; border:1px solid #cbd5e0; border-radius:6px; font-weight:bold; }
.color-picker { cursor:pointer; width:40px; height:36px; border:1px solid #cbd5e0; border-radius:4px; padding:2px; flex-shrink:0;}

.goal-box{ background:linear-gradient(135deg,#fde047,#f97316); padding:15px; border-radius:12px; color:#000; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.2); margin-bottom:10px; }
.goal-progress{ background:white; height:14px; border-radius:8px; overflow:hidden; margin-top:6px; }
.goal-bar{ height:100%; background:#22c55e; }

/* Ranking Styles */
.rank-top{display:flex;gap:12px;margin-bottom:12px;}
.rank-card{ flex:1;padding:18px;border-radius:16px;color:white; font-size:22px;font-weight:bold;text-align:center; text-shadow:1px 1px 2px rgba(0,0,0,0.3); }
.rank-1{background:linear-gradient(135deg,#facc15,#f59e0b);}
.rank-2{background:linear-gradient(135deg,#94a3b8,#475569);}
.rank-3{background:linear-gradient(135deg,#f87171,#b91c1c);}
.rank-list{background:white;border-radius:12px;padding:10px;font-size:16px; line-height:1.8;}
.rank-item-label { display:inline-block; margin-right:15px; margin-bottom:10px; font-size:14px; font-weight:bold; background:#f1f5f9; padding:6px 10px; border-radius:6px; border:1px solid #cbd5e0;}
</style>
</head>

<body>

<header>
 <div class="tab active" onclick="showTab('input')">入力</div>
 <div class="tab" onclick="showTab('board')">日別ボード</div>
 <div class="tab" onclick="showTab('monthly')">月間ボード</div>
 <div class="tab" onclick="showTab('ranking')">🏆 ランキング</div>
 <div class="tab" onclick="showTab('settings')">設定</div>
</header>

<div id="dateController" class="date-controller">
 <button class="date-btn" onclick="changeDate(-1)">◀ 前日</button>
 <div id="dateDisplay"></div>
 <button class="date-btn" onclick="changeDate(1)">翌日 ▶</button>
 <button class="date-btn-today" onclick="changeDate(0)">今日</button>
</div>

<div id="monthController" class="date-controller" style="display:none;">
 <button class="date-btn" onclick="changeMonth(-1)">◀ 前月</button>
 <div id="monthDisplay"></div>
 <button class="date-btn" onclick="changeMonth(1)">翌月 ▶</button>
 <button class="date-btn-today" onclick="changeMonth(0)">今月</button>
</div>

<div id="input" class="page active">
<div class="card">
 <div class="staff-selector">
  <label>スタッフ:</label>
  <select id="staffSelect" onchange="updateCounts()"></select>
  <button onclick="toggleLock()" id="lockBtn">🔓 固定OFF</button>

  <div class="handoff-wrap">
   <label><input type="checkbox" id="handoffToggle"> 引き継ぎ</label>
   <select id="handoffSelect" disabled></select>
  </div>
 </div>
</div>

<div class="card">
 <div class="items" id="btnContainer"></div>
</div>

<div class="card" id="goalDisplay" style="display:none; background:transparent; box-shadow:none; padding:0;"></div>
</div>

<div id="board" class="page">
 <div class="card">
  <h3 id="boardTitle"></h3>
  <div class="board-wrap">
   <table id="boardTable"></table>
  </div>
 </div>
</div>

<div id="monthly" class="page">
 <div class="card">
  <h3 id="monthlyTitle"></h3>
  <p style="font-size:12px; color:#64748b; margin-top:-10px;">※成約者（ポイント付与者）の月間トータル件数です。</p>
  <div class="board-wrap">
   <table id="monthlyTable"></table>
  </div>
 </div>
</div>

<div id="ranking" class="page">
 <div class="card">
  <h3 id="rankingTitle">🏆 月間スタッフ総合ランキング</h3>
  <p style="font-size:12px; color:#64748b; margin-top:-10px;">※設定画面で選ばれた「ランキング対象商材」の合計成約数です。</p>
  <div id="rankingTop" class="rank-top"></div>
  <div id="rankingList" class="rank-list"></div>
 </div>
</div>

<div id="settings" class="page">
<datalist id="paleColors">
 <option value="#e0f2fe"></option><option value="#fce7f3"></option><option value="#dcfce7"></option><option value="#fef9c3"></option>
 <option value="#f3e8ff"></option><option value="#ffedd5"></option><option value="#ccfbf1"></option><option value="#f1f5f9"></option>
</datalist>

<div class="card full-width">
 <h3 style="color:#ef4444;">🧹 データ大掃除</h3>
 <p style="font-size:12px; color:#64748b; margin-bottom:10px;">容量節約のため、1ヶ月以上前の不要な過去データを消去します。</p>
 <button onclick="deleteOldData()" style="background:#ef4444; color:white; border:none; padding:8px 15px; border-radius:6px; font-weight:bold; cursor:pointer;">🗑️ 1ヶ月以上前のデータを一括削除</button>
</div>

<div class="card full-width" style="background:#f0fdf4; border:1px solid #86efac;">
 <h3>🏆 月間ランキング対象商材の選択</h3>
 <p style="font-size:12px; color:#166534; margin-top:-10px;">チェックを入れた商材だけがランキングの集計対象になります。</p>
 <div id="rankingItemSelect" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
</div>

<div class="settings-grid">
 <div class="card">
  <h3>スタッフ管理</h3>
  <div class="add-form">
   <input type="text" id="newStaff" placeholder="名前">
   <button onclick="addStaff()">追加</button>
  </div>
  <div id="staffListUI"></div>
 </div>

 <div class="card">
  <h3>商材管理</h3>
  <div class="add-form">
   <input type="text" id="newItem" placeholder="新商材">
   <input type="color" id="newColor" value="#e0f2fe" list="paleColors">
   <button onclick="addItem()">追加</button>
  </div>
  <div id="itemListUI"></div>
 </div>
</div>

<div class="card">
 <h3 style="display:flex; justify-content:space-between; align-items:center;">
  今日の目標設定
  <button onclick="resetAllGoals()" style="background:#ef4444; color:white; border:none; padding:4px 10px; border-radius:4px; font-size:12px; cursor:pointer; font-weight:bold;">🗑️ 全リセット</button>
 </h3>
 <div id="goalPanel"></div>
</div>
</div>

<script>
/* Firebase */
const firebaseConfig={
 apiKey:"AIzaSyCmerraKVr1iJsRoiW53lxUtgDUcOGVXtY",
 authDomain:"ganbaru-sheet-a32f3.firebaseapp.com",
 projectId:"ganbaru-sheet-a32f3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ================= DATE & MONTH CONTROLLERS ================= */
let viewDate = new Date();
let viewMonth = new Date();

function getViewDateStr() {
  const y = viewDate.getFullYear();
  const m = String(viewDate.getMonth() + 1).padStart(2, '0');
  const d = String(viewDate.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function getViewMonthStr() {
  const y = viewMonth.getFullYear();
  const m = String(viewMonth.getMonth() + 1).padStart(2, '0');
  return `${y}-${m}`;
}

function updateDateDisplay() {
  const y = viewDate.getFullYear();
  const m = viewDate.getMonth() + 1;
  const d = viewDate.getDate();
  const w = ["日","月","火","水","木","金","土"][viewDate.getDay()];
  document.getElementById("dateDisplay").textContent = `${y}年${m}月${d}日(${w})`;
  document.getElementById("boardTitle").textContent = `${m}/${d} のがんばるシート`;
}

function updateMonthDisplay() {
  const y = viewMonth.getFullYear();
  const m = viewMonth.getMonth() + 1;
  document.getElementById("monthDisplay").textContent = `${y}年${m}月`;
  document.getElementById("monthlyTitle").textContent = `${y}年${m}月の月間集計`;
  document.getElementById("rankingTitle").textContent = `🏆 ${y}年${m}月 スタッフ総合ランキング`;
}

function changeDate(days) {
  if(days === 0) viewDate = new Date();
  else viewDate.setDate(viewDate.getDate() + days);
  updateDateDisplay();
  updateCounts();
  renderBoard();
  renderGoalsOnInput();
}

function changeMonth(months) {
  if(months === 0) viewMonth = new Date();
  else viewMonth.setMonth(viewMonth.getMonth() + months);
  updateMonthDisplay();
  renderMonthlyBoard();
  renderRanking();
}

/* Tabs */
const ADMIN_PASSWORD="0000";
function showTab(id){
 if(id==='settings'){
  const p=prompt("管理用パスワード:");
  if(p!==ADMIN_PASSWORD){ alert("NG"); return; }
 }
 
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 event.target.classList.add("active");

 // コントローラーの切り替え
 document.getElementById('dateController').style.display = (id === 'input' || id === 'board') ? 'flex' : 'none';
 document.getElementById('monthController').style.display = (id === 'monthly' || id === 'ranking') ? 'flex' : 'none';
}

/* Data */
let staffList=[], itemList=[], records=[];

// 初回の日付セット
updateDateDisplay();
updateMonthDisplay();

/* Load settings */
db.collection("settings").orderBy("order").onSnapshot(snap=>{
 staffList=[]; itemList=[];
 snap.forEach(d=>{
  const v=d.data(); v.id=d.id;
  if(v.type=="staff") staffList.push(v);
  if(v.type=="item") itemList.push(v);
 });
 renderAll();
});

/* Load sales */
db.collection("sales").onSnapshot(snap=>{
 records=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderBoard();
 updateCounts(); 
 renderGoalsOnInput(); 
 renderMonthlyBoard();
 renderRanking();
});

/* UI refs */
const staffSelect=document.getElementById("staffSelect");
const handoffSelect=document.getElementById("handoffSelect");
const btnContainer=document.getElementById("btnContainer");
const boardTable=document.getElementById("boardTable");
const lockBtn=document.getElementById("lockBtn");
const handoffToggle=document.getElementById("handoffToggle");

/* Lock */
let lockedStaff=localStorage.getItem("lockedStaff")||"";
function toggleLock(){
 if(lockedStaff){
  lockedStaff="";
  localStorage.removeItem("lockedStaff");
  lockBtn.textContent="🔓 固定OFF";
  lockBtn.classList.remove("locked");
  staffSelect.disabled = false;
 }else{
  lockedStaff=staffSelect.value;
  localStorage.setItem("lockedStaff",lockedStaff);
  lockBtn.textContent="🔒 固定ON";
  lockBtn.classList.add("locked");
  staffSelect.disabled = true;
 }
 updateCounts();
}

/* Render */
function renderAll(){
 const opts=staffList.map(s=>`<option>${s.name}</option>`).join("");
 staffSelect.innerHTML=opts;
 handoffSelect.innerHTML=opts;

 if(lockedStaff){
  staffSelect.value=lockedStaff;
  staffSelect.disabled=true;
  document.getElementById('lockBtn').textContent="🔒 固定ON";
  document.getElementById('lockBtn').classList.add("locked");
 }else{
  staffSelect.disabled=false;
  document.getElementById('lockBtn').textContent="🔓 固定OFF";
  document.getElementById('lockBtn').classList.remove("locked");
 }

 btnContainer.innerHTML=itemList.map(it=>`
 <div class="item-box">
  <button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
  <div class="item-footer">
   <div style="display:flex; flex-direction:column;">
    <span class="my-count" id="count_${it.name}">0件</span>
    <div class="rank-mini" id="rank_${it.name}"></div>
   </div>
   <button class="minus" onclick="removeRecord('${it.name}')">取消</button>
  </div>
 </div>`).join("");

 document.getElementById("staffListUI").innerHTML=`<ul class="list-ui">` + staffList.map(s=>`
 <li draggable="true" ondragstart="handleDragStart(event,'staff','${s.id}')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'${s.id}')" ondragend="handleDragEnd(event)">
  <div style="display:flex; align-items:center; gap:8px; width:100%;">
   <div class="drag-handle">☰</div>
   <input class="setting-input" value="${s.name}" onchange="editSetting('${s.id}',this.value,null)">
   <button class="delete-btn" onclick="deleteSetting('${s.id}')">削除</button>
  </div>
 </li>`).join("") + `</ul>`;

 document.getElementById("itemListUI").innerHTML=`<ul class="list-ui">` + itemList.map(it=>`
 <li draggable="true" ondragstart="handleDragStart(event,'item','${it.id}')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'${it.id}')" ondragend="handleDragEnd(event)" style="border-left: 5px solid ${it.color};">
  <div style="display:flex; align-items:center; gap:8px; width:100%;">
   <div class="drag-handle">☰</div>
   <input class="setting-input" value="${it.name}" onchange="editSetting('${it.id}',this.value,'${it.color}')">
   <input type="color" value="${it.color}" list="paleColors" class="color-picker" onchange="editSetting('${it.id}','${it.name}',this.value)">
   <button class="delete-btn" onclick="deleteSetting('${it.id}')">削除</button>
  </div>
 </li>`).join("") + `</ul>`;

 updateCounts();
 renderGoalPanel();
 renderRankingTargetUI();
}

/* ランキングと件数の更新処理（日別） */
function updateCounts(){
 const viewDateStr = getViewDateStr(); 
 const currentStaff = lockedStaff || staffSelect.value;

 itemList.forEach(it=>{
  const c = records.filter(r=>r.item==it.name && r.staff==currentStaff && r.date==viewDateStr).length;
  const countEl = document.getElementById("count_"+it.name);
  if(countEl) countEl.textContent=c+"件";

  const rank={};
  records.filter(r=>r.item==it.name && r.date==viewDateStr).forEach(r=>{
   rank[r.staff]=(rank[r.staff]||0)+1;
  });
  const sorted=Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const rankEl = document.getElementById("rank_"+it.name);
  if(rankEl) rankEl.innerHTML=sorted.map((r,i)=>`${i+1}位 ${r[0]}:${r[1]}件`).join("<br>");
 });
}

/* 成約登録 */
function addRecord(item){
 const baseStaff = lockedStaff || staffSelect.value;
 const staff = handoffToggle.checked ? handoffSelect.value : baseStaff;
 const registrar = handoffToggle.checked ? baseStaff : "";
 const date = getViewDateStr(); 
 const groupId = Date.now().toString();
 db.collection("sales").add({staff, registrar, item, date, groupId});
}

/* 取消 */
function removeRecord(item){
 const baseStaff = lockedStaff || staffSelect.value;
 const targetStaff = handoffToggle.checked ? handoffSelect.value : baseStaff;
 const viewDateStr = getViewDateStr(); 
 
 const r=records.filter(r=>r.item==item && r.date==viewDateStr && r.staff==targetStaff).pop();
 if(!r) return;
 
 records.filter(x=>x.groupId==r.groupId).forEach(x=>{
  db.collection("sales").doc(x.id).delete();
 });
}

/* 月間ボード描画 */
function renderMonthlyBoard(){
  const monthStr = getViewMonthStr(); 
  const monthRecords = records.filter(r => r.date.startsWith(monthStr));

  let html="<tr><th class='row-header' style='background:#f9fafb;'>商材 \\ スタッフ</th><th class='square' style='background:#f0fdf4; font-weight:bold;'>店舗合計</th>";
  staffList.forEach(s => {
    html += `<th class='square'>${s.name}</th>`;
  });
  html += "</tr>";

  itemList.forEach(it => {
    const itRecords = monthRecords.filter(r => r.item == it.name);
    
    // 店舗合計は groupId でユニーク化して数える（成約数ベース）
    const totalCount = groupBy(itRecords).length;
    
    html += `<tr><th class='row-header' style="background:${it.color}; color:#333;">${it.name}</th>
             <td class='square name-cell' style='font-weight:bold; font-size:14px; background:#dcfce7; color:#166534;'>${totalCount}</td>`;

    staffList.forEach(s => {
      // 個人の件数
      const staffCount = itRecords.filter(r => r.staff == s.name).length;
      html += `<td class='square' style='${staffCount > 0 ? "font-weight:bold; color:#0369a1; background:#e0f
