<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
/* ===== UI 見栄え ===== */
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f4f6; }

/* Tabs */
header{ display:flex; gap:10px; padding:8px; background:white; border-bottom:1px solid #ddd; }
.tab{ padding:6px 14px; border-radius:8px; cursor:pointer; background:#e5e7eb; font-weight:bold; color:#64748b;}
.tab.active{background:#2563eb;color:white;}

.page{display:none;padding:12px; max-width:1200px; margin:0 auto;}
.page.active{display:block;}

/* Cards */
.card{ background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:15px; }
.card h3 { margin-top:0; border-bottom:2px solid #e2e8f0; padding-bottom:8px; color:#334155; margin-bottom:15px; }

/* Staff selector & Lock */
.staff-selector { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:bold; color:#475569; }
.staff-selector select { font-size:16px; padding:10px; flex:1; min-width:150px; max-width:300px; border-radius:8px; border:1px solid #cbd5e0; background:#f8fafc; }
#lockBtn { padding:10px 15px; border:1px solid #cbd5e0; background:#f1f5f9; color:#64748b; border-radius:8px; cursor:pointer; font-weight:bold; white-space:nowrap; transition:0.3s; }
#lockBtn.locked { background:#3b82f6; color:white; border-color:#2563eb; }

/* Input buttons */
.items{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.item-box{ border:1px solid #ddd; border-radius:10px; padding:8px; background:white; }
.item-btn{ width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; color:white; cursor:pointer; 
 text-shadow: 1px 1px 0 rgba(0,0,0,0.6), -1px -1px 0 rgba(0,0,0,0.6), 1px -1px 0 rgba(0,0,0,0.6), -1px 1px 0 rgba(0,0,0,0.6), 0px 2px 4px rgba(0,0,0,0.5);}
.item-btn:active{opacity:0.7;}
.item-footer{ display:flex; justify-content:space-between; margin-top:6px; font-size:14px; align-items:center;}
.my-count { font-size:16px; font-weight:bold; color:#475569; }
.minus{ background:#f1f5f9; color:#64748b; border:1px solid #e2e8f0; padding:4px 10px; border-radius:6px; font-weight:bold; cursor:pointer; }
.rank-mini{ font-size:12px; color:#64748b; margin-top:4px; }

/* Board Table */
.board-wrap{ overflow-x:auto; padding-bottom:10px; }
table{ border-collapse:collapse; width:max-content; background:white; }
th,td{ border:1px solid #cbd5e0; padding:4px; text-align:center; font-size:12px; }
.row-header { position:sticky; left:0; z-index:1; border-right:2px solid #cbd5e0; font-weight:bold; white-space:nowrap; padding:8px 12px; background:#f8fafc;}
.square{ width:45px; height:45px; overflow:hidden; font-size:11px; background:#fff; vertical-align:middle; }
.square-cell { min-width: 45px; }
.name-cell { background:#e0f2fe; color:#0369a1; font-weight:bold; }

/* Settings (★修正点：スタッフ枠を狭め、1画面に収める) */
.settings-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
@media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }

.add-form { display:flex; gap:8px; align-items:center; margin-bottom:15px; }
.add-form input[type="text"] { flex:1; min-width:0; padding:10px; border:1px solid #cbd5e0; border-radius:6px; font-size:14px; }
.add-form input[type="color"] { width:45px; height:40px; padding:2px; border:1px solid #cbd5e0; border-radius:6px; cursor:pointer; flex-shrink:0;}
.add-form button { padding:10px 15px; background:#64748b; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; flex-shrink:0;}

.list-ui { list-style:none; padding:0; margin:0; max-height:500px; overflow-y:auto; }
.list-ui li { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-bottom:1px solid #edf2f7; background:white; margin-bottom:4px; border-radius:6px; transition:0.2s;}

/* ★修正点：ドラッグ＆ドロップ用のスタイル */
.drag-handle { cursor: grab; font-size: 18px; color: #94a3b8; padding: 0 4px; user-select: none; }
.drag-handle:active { cursor: grabbing; }
.list-ui li.dragging { opacity: 0.4; background: #f8fafc; border: 1px dashed #cbd5e0; }
.list-ui li.over { border-top: 3px solid #3b82f6; } /* ドロップ位置の青線 */

.delete-btn { background:#fca5a5; color:#7f1d1d; border:none; padding:8px 12px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:bold; flex-shrink:0;}
.setting-input { flex:1; min-width:50px; padding:8px; border:1px solid #cbd5e0; border-radius:6px; font-weight:bold; }
.color-picker { cursor:pointer; width:40px; height:36px; border:1px solid #cbd5e0; border-radius:4px; padding:2px; flex-shrink:0;}
</style>
</head>

<body>

<header>
 <div class="tab active" onclick="showTab('input')">入力</div>
 <div class="tab" onclick="showTab('board')">がんばるシート</div>
 <div class="tab" onclick="showTab('settings')">設定</div>
</header>

<div id="input" class="page active">

<div class="card">
 <div class="staff-selector">
  <label>スタッフ:</label>
  <select id="staffSelect"></select>
  <button onclick="toggleLock()" id="lockBtn">🔓 固定OFF</button>
 </div>
</div>

<div class="card">
 <div class="items" id="btnContainer"></div>
</div>

</div>

<div id="board" class="page">
 <div class="card">
  <h3 id="boardTitle">本日の成約ボード</h3>
  <div class="board-wrap">
   <table id="boardTable"></table>
  </div>
 </div>
</div>

<div id="settings" class="page">

<datalist id="paleColors">
 <option value="#e0f2fe"></option>
 <option value="#fce7f3"></option>
 <option value="#dcfce7"></option>
 <option value="#fef9c3"></option>
 <option value="#f3e8ff"></option>
 <option value="#ffedd5"></option>
 <option value="#ccfbf1"></option>
 <option value="#f1f5f9"></option>
</datalist>

<div class="settings-grid">
 <div class="card">
  <h3>スタッフ管理</h3>
  <div class="add-form">
   <input type="text" id="newStaff" placeholder="名前">
   <button onclick="addStaff()">追加</button>
  </div>
  <div id="staffListUI"></div>
 </div>

 <div class="card">
  <h3>商材管理</h3>
  <div class="add-form">
   <input type="text" id="newItem" placeholder="新商材">
   <input type="color" id="newColor" value="#e0f2fe" list="paleColors">
   <button onclick="addItem()">追加</button>
  </div>
  <div id="itemListUI"></div>
 </div>
</div>

</div>

<script>
/* ================= Firebase ================= */
const firebaseConfig={
 apiKey: "AIzaSyCmerraKVr1iJsRoiW53lxUtgDUcOGVXtY",
 authDomain: "ganbaru-sheet-a32f3.firebaseapp.com",
 projectId: "ganbaru-sheet-a32f3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ================= Tabs ================= */
const ADMIN_PASSWORD = "0000";

function showTab(id){
 if(id === 'settings') {
  const pass = prompt("管理用パスワードを入力してください:");
  if(pass !== ADMIN_PASSWORD) {
   if(pass !== null) alert("パスワードが違います。");
   return;
  }
 }
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 event.target.classList.add("active");
}

/* ================= Seed (初回のみ) ================= */
const pastel=["#e0f2fe","#fce7f3","#dcfce7","#fef9c3","#f3e8ff"];
async function seed(){
 const s=await db.collection("settings").get();
 if(!s.empty) return; 
 ["榎本","田中","佐藤"].forEach((n,i)=>db.collection("settings").add({type:"staff",name:n,order:i}));
 ["ひかり","カード","でんき","スマホ"].forEach((n,i)=>db.collection("settings").add({type:"item",name:n,color:pastel[i]||"#f1f5f9",order:i}));
}
seed();

/* ================= Data ================= */
let staffList=[],itemList=[],records=[];

const today = new Date();
const dateStr = `${today.getMonth() + 1}/${today.getDate()}`;
document.getElementById('boardTitle').textContent = `${dateStr} のがんばるシート`;

/* Settings realtime */
db.collection("settings").orderBy("order", "asc").onSnapshot(snap=>{
 staffList=[];itemList=[];
 snap.forEach(d=>{
  const v=d.data();v.id=d.id;
  if(v.type=="staff") staffList.push(v);
  if(v.type=="item") itemList.push(v);
 });
 renderAll();
});

/* Sales realtime */
db.collection("sales").onSnapshot(snap=>{
 records=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderAll();
});

/* ================= UI Render ================= */
const staffSelect=document.getElementById("staffSelect");
const btnContainer=document.getElementById("btnContainer");
const boardTable=document.getElementById("boardTable");
const staffListUI=document.getElementById("staffListUI");
const itemListUI=document.getElementById("itemListUI");

/* Staff Lock */
let lockedStaff=localStorage.getItem("lockedStaff")||"";
function toggleLock(){
 if(lockedStaff){
  lockedStaff="";
  localStorage.removeItem("lockedStaff");
  document.getElementById('lockBtn').textContent="🔓 固定OFF";
  document.getElementById('lockBtn').classList.remove("locked");
 }else{
  lockedStaff=staffSelect.value;
  localStorage.setItem("lockedStaff",lockedStaff);
  document.getElementById('lockBtn').textContent="🔒 固定ON";
  document.getElementById('lockBtn').classList.add("locked");
 }
 renderAll();
}

function renderAll(){
 staffSelect.innerHTML=staffList.map(s=>`<option>${s.name}</option>`).join("");
 if(lockedStaff){
  staffSelect.value=lockedStaff;
  staffSelect.disabled=true;
  document.getElementById('lockBtn').textContent="🔒 固定ON";
  document.getElementById('lockBtn').classList.add("locked");
 }else{
  staffSelect.disabled=false;
  document.getElementById('lockBtn').textContent="🔓 固定OFF";
  document.getElementById('lockBtn').classList.remove("locked");
 }

 btnContainer.innerHTML=itemList.map(it=>`
 <div class="item-box">
  <button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
  <div class="item-footer">
   <div style="display:flex; flex-direction:column;">
    <span class="my-count" id="count_${it.name}">0件</span>
    <div class="rank-mini" id="rank_${it.name}"></div>
   </div>
   <button class="minus" onclick="removeRecord('${it.name}')">− 取消</button>
  </div>
 </div>`).join("");

 // ★修正点：ドラッグ＆ドロップの「≡」ハンドルを追加
 staffListUI.innerHTML=`<ul class="list-ui">` + staffList.map(s=>`
 <li draggable="true" ondragstart="handleDragStart(event,'staff','${s.id}')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'${s.id}')" ondragend="handleDragEnd(event)">
  <div style="display:flex; align-items:center; gap:8px; width:100%;">
   <div class="drag-handle">☰</div>
   <input class="setting-input" value="${s.name}" onchange="editSetting('${s.id}',this.value,null)">
   <button class="delete-btn" onclick="deleteSetting('${s.id}')">削除</button>
  </div>
 </li>`).join("") + `</ul>`;

 itemListUI.innerHTML=`<ul class="list-ui">` + itemList.map(it=>`
 <li draggable="true" ondragstart="handleDragStart(event,'item','${it.id}')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'${it.id}')" ondragend="handleDragEnd(event)" style="border-left: 5px solid ${it.color};">
  <div style="display:flex; align-items:center; gap:8px; width:100%;">
   <div class="drag-handle">☰</div>
   <input class="setting-input" value="${it.name}" onchange="editSetting('${it.id}',this.value,'${it.color}')">
   <input type="color" value="${it.color}" list="paleColors" class="color-picker" onchange="editSetting('${it.id}','${it.name}',this.value)">
   <button class="delete-btn" onclick="deleteSetting('${it.id}')">削除</button>
  </div>
 </li>`).join("") + `</ul>`;

 updateCounts();
 renderBoard();
}

/* ================= Sales ================= */
function addRecord(item){
 const staff=lockedStaff||staffSelect.value;
 const date=new Date().toISOString().slice(0,10);
 db.collection("sales").add({staff,item,date});
}
function removeRecord(item){
 const staff=lockedStaff||staffSelect.value;
 const today=new Date().toISOString().slice(0,10);
 const r=records.filter(r=>r.item==item&&r.staff==staff&&r.date==today).pop();
 if(r) db.collection("sales").doc(r.id).delete();
}

/* ================= Counts + Ranking ================= */
function updateCounts(){
 const today=new Date().toISOString().slice(0,10);
 const staff=lockedStaff||staffSelect.value;

 itemList.forEach(it=>{
  const c=records.filter(r=>r.item==it.name&&r.staff==staff&&r.date==today).length;
  const countEl = document.getElementById("count_"+it.name);
  if(countEl) countEl.textContent=c+"件";

  const rank={};
  records.filter(r=>r.item==it.name&&r.date==today).forEach(r=>{
   rank[r.staff]=(rank[r.staff]||0)+1;
  });
  const sorted=Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const rankEl = document.getElementById("rank_"+it.name);
  if(rankEl) rankEl.innerHTML=sorted.map((r,i)=>`${i+1}位 ${r[0]}:${r[1]}件`).join("<br>");
 });
}

/* ================= Board Table ================= */
function renderBoard(){
 const today=new Date().toISOString().slice(0,10);
 let maxCols = 20;

 itemList.forEach(it=>{
  const count = records.filter(r=>r.item==it.name&&r.date==today).length;
  if(count > maxCols) maxCols = count;
 });

 let html="<tr><th class='row-header' style='background:#f9fafb;'>商材名</th>";
 for(let i=1; i<=maxCols; i++){
  html+=`<th class='square-cell'>${i}</th>`;
 }
 html+="</tr>";

 itemList.forEach(it=>{
  html+=`<tr><th class='row-header' style='background:${it.color}; color:#333;'>${it.name}</th>`;
  
  const itemRecords = records.filter(r=>r.item==it.name&&r.date==today);
  for(let i=0; i<maxCols; i++){
   const staffName = itemRecords[i] ? itemRecords[i].staff : '';
   const cellClass = staffName ? 'name-cell' : '';
   html+=`<td class='square ${cellClass}'>${staffName}</td>`;
  }
  html+="</tr>";
 });

 boardTable.innerHTML=html;
}

/* ================= Settings CRUD ================= */
function addStaff(){
 const n=document.getElementById("newStaff").value;
 if(n) db.collection("settings").add({type:"staff",name:n,order:Date.now()});
 document.getElementById("newStaff").value = "";
}
function addItem(){
 const n=document.getElementById("newItem").value;
 const c=document.getElementById("newColor").value;
 if(n) db.collection("settings").add({type:"item",name:n,color:c,order:Date.now()});
 document.getElementById("newItem").value = "";
}
function editSetting(id,name,color){
 const data={name};
 if(color) data.color=color;
 db.collection("settings").doc(id).update(data);
}
function deleteSetting(id){
 if(confirm("本当に削除しますか？")) db.collection("settings").doc(id).delete();
}

/* ================= Drag & Drop (★追加機能) ================= */
let dragType = null;

function handleDragStart(e, type, id) {
 dragType = type;
 e.dataTransfer.effectAllowed = 'move';
 e.dataTransfer.setData('text/plain', id);
 e.target.classList.add('dragging');
}

function handleDragOver(e) {
 e.preventDefault();
 e.dataTransfer.dropEffect = 'move';
 const li = e.target.closest('li');
 if (li && !li.classList.contains('dragging')) li.classList.add('over');
 return false;
}

function handleDragLeave(e) {
 const li = e.target.closest('li');
 if (li) li.classList.remove('over');
}

async function handleDrop(e, targetId) {
 e.stopPropagation();
 e.preventDefault();
 const li = e.target.closest('li');
 if (li) li.classList.remove('over');
 
 const sourceId = e.dataTransfer.getData('text/plain');
 if (sourceId && sourceId !== targetId && dragType) {
  const list = (dragType === 'staff') ? [...staffList] : [...itemList];
  const draggedIdx = list.findIndex(i => i.id === sourceId);
  const targetIdx = list.findIndex(i => i.id === targetId);
  
  if (draggedIdx > -1 && targetIdx > -1) {
   // リスト内の要素を入れ替え
   const item = list.splice(draggedIdx, 1)[0];
   list.splice(targetIdx, 0, item);
   
   // Firebase上の "order" を一括更新
   const batch = db.batch();
   list.forEach((it, index) => {
    batch.update(db.collection("settings").doc(it.id), { order: index });
   });
   await batch.commit();
  }
 }
 return false;
}

function handleDragEnd(e) {
 document.querySelectorAll('.list-ui li').forEach(el => {
  el.classList.remove('dragging', 'over');
 });
}
</script>

</body>
</html>
