<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f4f6; }

/* Tabs */
header{ display:flex; gap:10px; padding:8px; background:white; border-bottom:1px solid #ddd; }
.tab{ padding:6px 14px; border-radius:8px; cursor:pointer; background:#e5e7eb; font-weight:bold; color:#64748b;}
.tab.active{background:#2563eb;color:white;}

.page{display:none;padding:12px; max-width:1200px; margin:0 auto;}
.page.active{display:block;}

/* Cards */
.card{ background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:15px; }
.card h3 { margin-top:0; border-bottom:2px solid #e2e8f0; padding-bottom:8px; color:#334155; margin-bottom:15px; }

/* Staff selector */
.staff-selector { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:bold; color:#475569; }
.staff-selector select { font-size:16px; padding:10px; flex:1; min-width:150px; max-width:300px; border-radius:8px; border:1px solid #cbd5e0; background:#f8fafc; }
#lockBtn { padding:10px 15px; border:1px solid #cbd5e0; background:#f1f5f9; color:#64748b; border-radius:8px; cursor:pointer; font-weight:bold; }
#lockBtn.locked { background:#3b82f6; color:white; }

/* Items */
.items{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.item-box{ border:1px solid #ddd; border-radius:10px; padding:8px; background:white; }
.item-btn{ 
  width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer;
  color:#000;
  text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 0px 2px 4px rgba(0,0,0,0.2);
}
.item-footer{ display:flex; justify-content:space-between; margin-top:6px; font-size:14px; align-items:center;}
.minus{ background:#f1f5f9; border:1px solid #e2e8f0; padding:4px 10px; border-radius:6px; font-weight:bold; cursor:pointer; }

.my-count { font-size:16px; font-weight:bold; color:#475569; }
.rank-mini { font-size:12px; color:#64748b; margin-top:4px; }

/* Board */
.board-wrap{ overflow-x:auto; }
table{ border-collapse:collapse; width:max-content; background:white; }
th,td{ border:1px solid #cbd5e0; padding:4px; text-align:center; font-size:12px; }
.row-header { position:sticky; left:0; z-index:1; font-weight:bold; background:#f8fafc; }
.square{ width:60px; height:60px; font-size:12px; background:#fff; vertical-align:middle; }
.name-cell{ background:#f0f9ff; }

/* 引き継ぎ表示スタイル */
.normal-name{ font-weight:bold; color:#000; }
.handoff-main{ font-weight:bold; color:#dc2626; } /* 赤 */
.handoff-sub{ font-size:10px; color:#64748b; }

/* 引き継ぎ UI */
.handoff-wrap {
 display:flex; align-items:center; gap:8px;
 padding-left:15px; margin-left:5px; border-left:2px solid #cbd5e0;
}
.handoff-wrap select {
 font-size:16px; padding:8px; border-radius:8px;
 border:1px solid #cbd5e0; background:#f8fafc;
}

/* Settings */
.settings-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
@media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
.add-form { display:flex; gap:8px; align-items:center; margin-bottom:15px; }
.add-form input[type="text"] { flex:1; min-width:0; padding:10px; border:1px solid #cbd5e0; border-radius:6px; font-size:14px; }
.add-form input[type="color"] { width:45px; height:40px; padding:2px; border:1px solid #cbd5e0; border-radius:6px; cursor:pointer; flex-shrink:0;}
.add-form button { padding:10px 15px; background:#64748b; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; flex-shrink:0;}
.list-ui { list-style:none; padding:0; margin:0; max-height:500px; overflow-y:auto; }
.list-ui li { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-bottom:1px solid #edf2f7; background:white; margin-bottom:4px; border-radius:6px; transition:0.2s;}
.drag-handle { cursor: grab; font-size: 18px; color: #94a3b8; padding: 0 4px; user-select: none; }
.drag-handle:active { cursor: grabbing; }
.list-ui li.dragging { opacity: 0.4; background: #f8fafc; border: 1px dashed #cbd5e0; }
.list-ui li.over { border-top: 3px solid #3b82f6; }
.delete-btn { background:#fca5a5; color:#7f1d1d; border:none; padding:8px 12px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:bold; flex-shrink:0;}
.setting-input { flex:1; min-width:50px; padding:8px; border:1px solid #cbd5e0; border-radius:6px; font-weight:bold; }
.color-picker { cursor:pointer; width:40px; height:36px; border:1px solid #cbd5e0; border-radius:4px; padding:2px; flex-shrink:0;}

.goal-box{
 background:linear-gradient(135deg,#fde047,#f97316); padding:15px; border-radius:12px;
 color:#000; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.2); margin-bottom:10px;
}
.goal-progress{ background:white; height:14px; border-radius:8px; overflow:hidden; margin-top:6px; }
.goal-bar{ height:100%; background:#22c55e; }
</style>
</head>

<body>

<header>
 <div class="tab active" onclick="showTab('input')">入力</div>
 <div class="tab" onclick="showTab('board')">がんばるシート</div>
 <div class="tab" onclick="showTab('settings')">設定</div>
</header>

<div id="input" class="page active">

<div class="card">
 <div class="staff-selector">
  <label>スタッフ:</label>
  <select id="staffSelect" onchange="updateCounts()"></select>
  <button onclick="toggleLock()" id="lockBtn">🔓 固定OFF</button>

  <div class="handoff-wrap">
   <label><input type="checkbox" id="handoffToggle"> 引き継ぎ</label>
   <select id="handoffSelect" disabled></select>
  </div>
 </div>
</div>

<div class="card">
 <div class="items" id="btnContainer"></div>
</div>

<div class="card" id="goalDisplay" style="display:none; background:transparent; box-shadow:none; padding:0;"></div>

</div>

<div id="board" class="page">
 <div class="card">
  <h3 id="boardTitle"></h3>
  <div class="board-wrap">
   <table id="boardTable"></table>
  </div>
 </div>
</div>

<div id="settings" class="page">
<datalist id="paleColors">
 <option value="#e0f2fe"></option>
 <option value="#fce7f3"></option>
 <option value="#dcfce7"></option>
 <option value="#fef9c3"></option>
 <option value="#f3e8ff"></option>
 <option value="#ffedd5"></option>
 <option value="#ccfbf1"></option>
 <option value="#f1f5f9"></option>
</datalist>

<div class="settings-grid">
 <div class="card">
  <h3>スタッフ管理</h3>
  <div class="add-form">
   <input type="text" id="newStaff" placeholder="名前">
   <button onclick="addStaff()">追加</button>
  </div>
  <div id="staffListUI"></div>
 </div>

 <div class="card">
  <h3>商材管理</h3>
  <div class="add-form">
   <input type="text" id="newItem" placeholder="新商材">
   <input type="color" id="newColor" value="#e0f2fe" list="paleColors">
   <button onclick="addItem()">追加</button>
  </div>
  <div id="itemListUI"></div>
 </div>
</div>

<div class="card">
 <h3>今日の目標設定</h3>
 <div id="goalPanel"></div>
</div>
</div>

<script>
/* Firebase */
const firebaseConfig={
 apiKey:"AIzaSyCmerraKVr1iJsRoiW53lxUtgDUcOGVXtY",
 authDomain:"ganbaru-sheet-a32f3.firebaseapp.com",
 projectId:"ganbaru-sheet-a32f3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* Tabs */
const ADMIN_PASSWORD="0000";
function showTab(id){
 if(id==='settings'){
  const p=prompt("管理用パスワード:");
  if(p!==ADMIN_PASSWORD){ alert("NG"); return; }
 }
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 event.target.classList.add("active");
}

/* Data */
let staffList=[], itemList=[], records=[];
const today=new Date();
document.getElementById("boardTitle").textContent=`${today.getMonth()+1}/${today.getDate()} のがんばるシート`;

/* Load settings */
db.collection("settings").orderBy("order").onSnapshot(snap=>{
 staffList=[]; itemList=[];
 snap.forEach(d=>{
  const v=d.data(); v.id=d.id;
  if(v.type=="staff") staffList.push(v);
  if(v.type=="item") itemList.push(v);
 });
 renderAll();
});

/* Load sales */
db.collection("sales").onSnapshot(snap=>{
 records=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderBoard();
 updateCounts(); 
 renderGoalsOnInput(); 
});

/* UI refs */
const staffSelect=document.getElementById("staffSelect");
const handoffSelect=document.getElementById("handoffSelect");
const btnContainer=document.getElementById("btnContainer");
const boardTable=document.getElementById("boardTable");
const lockBtn=document.getElementById("lockBtn");
const handoffToggle=document.getElementById("handoffToggle");

/* Lock */
let lockedStaff=localStorage.getItem("lockedStaff")||"";
function toggleLock(){
 if(lockedStaff){
  lockedStaff="";
  localStorage.removeItem("lockedStaff");
  lockBtn.textContent="🔓 固定OFF";
  lockBtn.classList.remove("locked");
  staffSelect.disabled = false; // ★修正：即時でグレーアウト解除
 }else{
  lockedStaff=staffSelect.value;
  localStorage.setItem("lockedStaff",lockedStaff);
  lockBtn.textContent="🔒 固定ON";
  lockBtn.classList.add("locked");
  staffSelect.disabled = true; // ★修正：即時でグレーアウト反映
 }
 updateCounts();
}

/* Render */
function renderAll(){
 const opts=staffList.map(s=>`<option>${s.name}</option>`).join("");
 staffSelect.innerHTML=opts;
 handoffSelect.innerHTML=opts;

 // ★ロック状態による初期設定
 if(lockedStaff){
  staffSelect.value=lockedStaff;
  staffSelect.disabled=true;
  document.getElementById('lockBtn').textContent="🔒 固定ON";
  document.getElementById('lockBtn').classList.add("locked");
 }else{
  staffSelect.disabled=false;
  document.getElementById('lockBtn').textContent="🔓 固定OFF";
  document.getElementById('lockBtn').classList.remove("locked");
 }

 btnContainer.innerHTML=itemList.map(it=>`
 <div class="item-box">
  <button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
  <div class="item-footer">
   <div style="display:flex; flex-direction:column;">
    <span class="my-count" id="count_${it.name}">0件</span>
    <div class="rank-mini" id="rank_${it.name}"></div>
   </div>
   <button class="minus" onclick="removeRecord('${it.name}')">取消</button>
  </div>
 </div>`).join("");

 document.getElementById("staffListUI").innerHTML=`<ul class="list-ui">` + staffList.map(s=>`
 <li draggable="true" ondragstart="handleDragStart(event,'staff','${s.id}')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'${s.id}')" ondragend="handleDragEnd(event)">
  <div style="display:flex; align-items:center; gap:8px; width:100%;">
   <div class="drag-handle">☰</div>
   <input class="setting-input" value="${s.name}" onchange="editSetting('${s.id}',this.value,null)">
   <button class="delete-btn" onclick="deleteSetting('${s.id}')">削除</button>
  </div>
 </li>`).join("") + `</ul>`;

 document.getElementById("itemListUI").innerHTML=`<ul class="list-ui">` + itemList.map(it=>`
 <li draggable="true" ondragstart="handleDragStart(event,'item','${it.id}')" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'${it.id}')" ondragend="handleDragEnd(event)" style="border-left: 5px solid ${it.color};">
  <div style="display:flex; align-items:center; gap:8px; width:100%;">
   <div class="drag-handle">☰</div>
   <input class="setting-input" value="${it.name}" onchange="editSetting('${it.id}',this.value,'${it.color}')">
   <input type="color" value="${it.color}" list="paleColors" class="color-picker" onchange="editSetting('${it.id}','${it.name}',this.value)">
   <button class="delete-btn" onclick="deleteSetting('${it.id}')">削除</button>
  </div>
 </li>`).join("") + `</ul>`;

 updateCounts();
 renderGoalPanel();
}

/* ランキングと件数の更新処理 */
function updateCounts(){
 const todayDate=new Date().toISOString().slice(0,10);
 const currentStaff = lockedStaff || staffSelect.value;

 itemList.forEach(it=>{
  const c = records.filter(r=>r.item==it.name && r.staff==currentStaff && r.date==todayDate).length;
  const countEl = document.getElementById("count_"+it.name);
  if(countEl) countEl.textContent=c+"件";

  const rank={};
  records.filter(r=>r.item==it.name && r.date==todayDate).forEach(r=>{
   rank[r.staff]=(rank[r.staff]||0)+1;
  });
  const sorted=Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const rankEl = document.getElementById("rank_"+it.name);
  if(rankEl) rankEl.innerHTML=sorted.map((r,i)=>`${i+1}位 ${r[0]}:${r[1]}件`).join("<br>");
 });
}

/* 成約登録 */
function addRecord(item){
 const baseStaff = lockedStaff || staffSelect.value;
 const staff = handoffToggle.checked ? handoffSelect.value : baseStaff;
 const registrar = handoffToggle.checked ? baseStaff : "";
 const date=new Date().toISOString().slice(0,10);
 const groupId=Date.now().toString();
 db.collection("sales").add({staff, registrar, item, date, groupId});
}

/* 取消 */
function removeRecord(item){
 const todayStr=new Date().toISOString().slice(0,10);
 const r=records.filter(r=>r.item==item && r.date==todayStr).pop();
 if(!r) return;
 records.filter(x=>x.groupId==r.groupId).forEach(x=>{
  db.collection("sales").doc(x.id).delete();
 });
}

/* ボード描画 */
function renderBoard(){
 const todayStr=new Date().toISOString().slice(0,10);
 let maxCols=20;

 itemList.forEach(it=>{
  const groups=groupBy(records.filter(r=>r.item==it.name && r.date==todayStr));
  if(groups.length>maxCols) maxCols=groups.length;
 });

 let html="<tr><th class='row-header'>商材</th><th>合計</th>";
 for(let i=1;i<=maxCols;i++) html+=`<th>${i}</th>`;
 html+="</tr>";

 itemList.forEach(it=>{
  const groups=groupBy(records.filter(r=>r.item==it.name && r.date==todayStr));
  html+=`<tr><th class='row-header' style="background:${it.color}">${it.name}</th>
  <td>${groups.length}件</td>`;

  for(let i=0;i<maxCols;i++){
   if(!groups[i]){
    html+=`<td class='square'></td>`;
    continue;
   }

   const g=groups[i][0];

   if(!g.registrar){
    html+=`<td class='square name-cell'><div class="normal-name">${g.staff}</div></td>`;
   }
   else{
    html+=`<td class='square name-cell'>
      <div class="handoff-main">成：${g.staff}</div>
      <div class="handoff-sub">${g.registrar}</div>
    </td>`;
   }
  }
  html+="</tr>";
 });

 boardTable.innerHTML=html;
}

/* group helper */
function groupBy(arr){
 const m={};
 arr.forEach(r=>{
  if(!m[r.groupId]) m[r.groupId]=[];
  m[r.groupId].push(r);
 });
 return Object.values(m);
}

/* 引き継ぎ select disable */
handoffToggle.onchange=()=>handoffSelect.disabled=!handoffToggle.checked;

/* ================= Settings CRUD & Drag/Drop ================= */
function addStaff(){
 const n=document.getElementById("newStaff").value;
 if(n) db.collection("settings").add({type:"staff",name:n,order:Date.now()});
 document.getElementById("newStaff").value = "";
}
function addItem(){
 const n=document.getElementById("newItem").value;
 const c=document.getElementById("newColor").value;
 if(n) db.collection("settings").add({type:"item",name:n,color:c,order:Date.now()});
 document.getElementById("newItem").value = "";
}
function editSetting(id,name,color){
 const data={name};
 if(color) data.color=color;
 db.collection("settings").doc(id).update(data);
}
function deleteSetting(id){
 if(confirm("本当に削除しますか？")) db.collection("settings").doc(id).delete();
}

let dragType = null;
function handleDragStart(e, type, id) { dragType = type; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); e.target.classList.add('dragging'); }
function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; const li = e.target.closest('li'); if (li && !li.classList.contains('dragging')) li.classList.add('over'); return false; }
function handleDragLeave(e) { const li = e.target.closest('li'); if (li) li.classList.remove('over'); }
async function handleDrop(e, targetId) {
 e.stopPropagation(); e.preventDefault();
 const li = e.target.closest('li'); if (li) li.classList.remove('over');
 const sourceId = e.dataTransfer.getData('text/plain');
 if (sourceId && sourceId !== targetId && dragType) {
  const list = (dragType === 'staff') ? [...staffList] : [...itemList];
  const draggedIdx = list.findIndex(i => i.id === sourceId);
  const targetIdx = list.findIndex(i => i.id === targetId);
  if (draggedIdx > -1 && targetIdx > -1) {
   const item = list.splice(draggedIdx, 1)[0];
   list.splice(targetIdx, 0, item);
   const batch = db.batch();
   list.forEach((it, index) => { batch.update(db.collection("settings").doc(it.id), { order: index }); });
   await batch.commit();
  }
 }
 return false;
}
function handleDragEnd(e) { document.querySelectorAll('.list-ui li').forEach(el => { el.classList.remove('dragging', 'over'); }); }

/* ================= Goals ================= */
let goals = {};
db.collection("goals").onSnapshot(snap=>{
 goals={};
 snap.forEach(d=>{ goals[d.data().item]=d.data(); });
 renderGoalPanel();
 renderGoalsOnInput();
});

function renderGoalPanel(){
 const goalPanel=document.getElementById("goalPanel");
 if(!goalPanel) return;
 
 goalPanel.style.display="grid";
 goalPanel.style.gridTemplateRows="repeat(15, max-content)";
 goalPanel.style.gridAutoFlow="column";
 goalPanel.style.gap="4px 10px"; // ★隙間をキュッと縮めました
 goalPanel.style.overflowX="auto";

 goalPanel.innerHTML=itemList.map(it=>{
  const g=goals[it.name]?.target||0;
  let opts="";
  for(let i=0; i<=99; i++){
   const num = i < 10 ? "0" + i : i;
   opts+=`<option value="${i}" ${g==i?'selected':''}>${num}</option>`;
  }
  return `
   <div style="display:flex; align-items:center;">
    <div style="font-weight:bold; font-size:14px; width:112px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${it.name}</div>
    <select style="width:55px; padding:4px; border:1px solid #cbd5e0; border-radius:6px; font-size:16px; text-align:center; background:#fff; cursor:pointer;" 
     onchange="setGoal('${it.name}',this.value)">
     ${opts}
    </select>
   </div>`;
 }).join("");
}

function setGoal(item,val){
 if(val === "" || val == 0) {
  db.collection("goals").doc(item).delete(); // 0なら削除
 } else {
  db.collection("goals").doc(item).set({item, target:Number(val)});
 }
}

function renderGoalsOnInput(){
 const box=document.getElementById("goalDisplay");
 if(!box) return;
 const todayDate=new Date().toISOString().slice(0,10);

 const htmls = itemList.map(it=>{
  const target=goals[it.name]?.target||0;
  if(!target) return "";
  
  const current = groupBy(records.filter(r=>r.item==it.name && r.date==todayDate)).length;
  const pct=Math.min(100, Math.round(current/target*100));

  return `
  <div class="goal-box">
   🔥 ${it.name} 目標 ${target}件 / 現在 ${current}件 (${pct}%)
   <div class="goal-progress">
    <div class="goal-bar" style="width:${pct}%"></div>
   </div>
  </div>`;
 }).filter(h=>h!=="");

 if(htmls.length > 0) {
  box.style.display = "block";
  box.innerHTML = htmls.join("");
 } else {
  box.style.display = "none";
  box.innerHTML = "";
 }
}
</script>

</body>
</html>
