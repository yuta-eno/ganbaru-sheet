<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<!-- Firebase compat（古いAndroid & iPad対応） -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
:root{
 --glass-bg: rgba(255,255,255,0.18);
 --glass-border: rgba(255,255,255,0.3);
 --blur: 20px;
 --bg: linear-gradient(135deg,#667eea,#764ba2);
 --text:#0f172a;
 --accent:#6366f1;
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;}
body{
 margin:0;
 background:var(--bg);
 color:white;
 height:100vh;
 display:flex;
 flex-direction:column;
 overflow:hidden;
}

header{
 padding:14px 20px;
 font-size:22px;
 font-weight:600;
 backdrop-filter: blur(var(--blur));
 background: var(--glass-bg);
 border-bottom:1px solid var(--glass-border);
}

.dashboard{
 display:grid;
 grid-template-columns: 2fr 1fr;
 gap:16px;
 padding:16px;
 height:100%;
}

.card{
 background:var(--glass-bg);
 backdrop-filter: blur(var(--blur));
 border:1px solid var(--glass-border);
 border-radius:22px;
 padding:16px;
 box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.big-title{
 font-size:26px;
 font-weight:700;
 margin-bottom:10px;
}

.items{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:12px;
}

.item-btn{
 border-radius:18px;
 padding:18px;
 font-size:20px;
 font-weight:600;
 color:white;
 border:none;
 cursor:pointer;
 backdrop-filter: blur(8px);
 box-shadow:0 10px 20px rgba(0,0,0,.25);
 transition:0.15s;
}
.item-btn:active{transform:scale(.95);}

.rank-list li{
 font-size:20px;
 padding:6px 0;
}

.counter{
 font-size:50px;
 font-weight:700;
}

footer{
 position:fixed;
 bottom:0;
 width:100%;
 text-align:center;
 padding:6px;
 font-size:14px;
 opacity:.7;
}
</style>
</head>

<body>

<header>📊 GANBARU SHEET PRO Dashboard</header>

<div class="dashboard">

<!-- 左：成約入力パネル -->
<div class="card">
 <div class="big-title">商材タップで成約登録</div>
 <select id="staffSelect" style="font-size:20px;padding:8px;border-radius:10px;border:none;"></select>
 <div class="items" id="btnContainer"></div>
</div>

<!-- 右：リアルタイムダッシュボード -->
<div class="card">
 <div class="big-title">本日の成約数</div>
 <div id="todayCount" class="counter">0</div>

 <div class="big-title" style="margin-top:20px;">月間ランキング</div>
 <ul id="rankingUI" class="rank-list"></ul>
</div>

</div>

<footer>店舗壁掛け iPad / Firebase Realtime Sync</footer>

<script>
/* ================= Firebase 設定 ================= */
const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= DOM ================= */
const staffSelect = document.getElementById("staffSelect");
const btnContainer = document.getElementById("btnContainer");
const todayCountUI = document.getElementById("todayCount");
const rankingUI = document.getElementById("rankingUI");

/* ================= 初期データ ================= */
const pastelColors=["#60a5fa","#a78bfa","#34d399","#fbbf24","#f472b6","#38bdf8"];

/* Seed */
async function seedDefault(){
 const s=await db.collection("settings").get();
 if(!s.empty) return;

 ["榎本","田中","佐藤"].forEach((n,i)=>{
  db.collection("settings").doc("staff_"+i).set({type:"staff",name:n,order:i});
 });
 ["ひかり","カード","でんき","スマホ"].forEach((n,i)=>{
  db.collection("settings").doc("item_"+i).set({type:"item",name:n,color:pastelColors[i],order:i});
 });
}
seedDefault();

/* ================= 設定読み込み ================= */
let staffList=[], itemList=[];
db.collection("settings").onSnapshot(snap=>{
 staffList=[]; itemList=[];
 snap.forEach(d=>{
  const v=d.data();
  if(v.type=="staff") staffList.push(v);
  if(v.type=="item") itemList.push(v);
 });
 renderUI();
});

function renderUI(){
 staffSelect.innerHTML = staffList.sort((a,b)=>a.order-b.order)
  .map(s=>`<option>${s.name}</option>`).join("");

 btnContainer.innerHTML = itemList.sort((a,b)=>a.order-b.order)
  .map(it=>`<button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>`).join("");
}

/* ================= 成約登録 ================= */
function addRecord(itemName){
 const staff=staffSelect.value;
 const now=new Date();
 const dateKey=now.toISOString().slice(0,10);
 const monthKey=now.getFullYear()+"-"+(now.getMonth()+1);

 db.collection("sales").add({
  staff, item:itemName,
  date:dateKey,
  month:monthKey,
  time:firebase.firestore.FieldValue.serverTimestamp()
 });
}

/* ================= リアルタイム集計 ================= */
db.collection("sales").onSnapshot(snap=>{
 const today=new Date().toISOString().slice(0,10);
 let todayCount=0;
 const rank={};

 snap.forEach(d=>{
  const v=d.data();
  if(v.date==today) todayCount++;
  rank[v.staff]=(rank[v.staff]||0)+1;
 });

 todayCountUI.textContent=todayCount;

 const sorted=Object.entries(rank).sort((a,b)=>b[1]-a[1]);
 rankingUI.innerHTML=sorted.map((r,i)=>`<li>${i+1}位 ${r[0]}：${r[1]}件</li>`).join("");
});
</script>

</body>
</html>
