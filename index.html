<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
/* ===== UI ===== */
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#f3f4f6;
}

/* Tabs */
header{
 display:flex;
 gap:10px;
 padding:8px;
 background:white;
 border-bottom:1px solid #ddd;
}
.tab{
 padding:6px 14px;
 border-radius:8px;
 cursor:pointer;
 background:#e5e7eb;
}
.tab.active{background:#2563eb;color:white;font-weight:bold;}

.page{display:none;padding:12px;}
.page.active{display:block;}

/* Cards */
.card{
 background:white;
 border-radius:12px;
 padding:12px;
 box-shadow:0 2px 8px rgba(0,0,0,.08);
 margin-bottom:12px;
}

/* Input buttons */
.items{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:10px;
}
.item-box{
 border:1px solid #ddd;
 border-radius:10px;
 padding:8px;
 background:white;
}

/* ★修正点：文字を白抜き＋黒い縁取りでくっきり見やすく */
.item-btn{
 width:100%;
 padding:12px;
 border:none;
 border-radius:8px;
 font-size:16px;
 font-weight:bold;
 color:white;
 text-shadow: 
  1px 1px 0 rgba(0,0,0,0.6), 
  -1px -1px 0 rgba(0,0,0,0.6), 
  1px -1px 0 rgba(0,0,0,0.6), 
  -1px 1px 0 rgba(0,0,0,0.6), 
  0px 2px 4px rgba(0,0,0,0.5);
 cursor:pointer;
}

.item-footer{
 display:flex;
 justify-content:space-between;
 margin-top:6px;
 font-size:14px;
}
.minus{
 background:#ef4444;color:white;border:none;padding:4px 10px;border-radius:6px;
}
.rank-mini{
 font-size:12px;color:#374151;margin-top:4px;
}

/* Board Table (★修正点：がんばるシート用のスタイル) */
.board-wrap{
 background:white;
 padding:10px;
 border-radius:12px;
 overflow-x:auto; /* 横スクロール可能に */
}
table{
 border-collapse:collapse;
 width:max-content; /* 中身に合わせて横に伸びる */
 background:white;
}
th,td{
 border:1px solid #999;
 padding:4px;
 text-align:center;
 font-size:12px;
}
.row-header {
 position:sticky;
 left:0;
 z-index:1;
 border-right:2px solid #999;
 font-weight:bold;
 white-space:nowrap;
 padding:8px 12px;
}
.square{
 width:45px;
 height:45px;
 overflow:hidden;
 font-size:11px;
 background:#fff;
 vertical-align:middle;
}
.square-cell {
 min-width: 45px;
}
.name-cell {
 background:#e0f2fe; 
 color:#0369a1; 
 font-weight:bold;
}
th{
 background:#f9fafb;
}

/* Settings (★修正点：2カラムで見やすく) */
.settings-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 15px;
}
@media (max-width: 768px) {
 .settings-grid { grid-template-columns: 1fr; }
}
.setting-row{
 display:flex;
 gap:6px;
 margin-bottom:6px;
}
</style>
</head>

<body>

<header>
 <div class="tab active" onclick="showTab('input')">入力</div>
 <div class="tab" onclick="showTab('board')">がんばるシート</div>
 <div class="tab" onclick="showTab('settings')">設定</div>
</header>

<div id="input" class="page active">

<div class="card">
 スタッフ:
 <select id="staffSelect"></select>
 <button onclick="toggleLock()" id="lockBtn">🔓 固定OFF</button>
</div>

<div class="card">
 <div class="items" id="btnContainer"></div>
</div>

</div>

<div id="board" class="page">
 <div class="board-wrap">
  <h3 id="boardTitle">本日の成約ボード</h3>
  <table id="boardTable"></table>
 </div>
</div>

<div id="settings" class="page">

<datalist id="paleColors">
 <option value="#e0f2fe"></option> <option value="#fce7f3"></option> <option value="#dcfce7"></option> <option value="#fef9c3"></option> <option value="#f3e8ff"></option> <option value="#ffedd5"></option> <option value="#ccfbf1"></option> <option value="#f1f5f9"></option> </datalist>

<div class="settings-grid">
 <div class="card">
  <h3>スタッフ管理</h3>
  <input id="newStaff"><button onclick="addStaff()">追加</button>
  <div id="staffListUI" style="margin-top:10px;"></div>
 </div>

 <div class="card">
  <h3>商材管理</h3>
  <input id="newItem">
  <input type="color" id="newColor" value="#e0f2fe" list="paleColors">
  <button onclick="addItem()">追加</button>
  <div id="itemListUI" style="margin-top:10px;"></div>
 </div>
</div>

</div>

<script>
/* ================= Firebase ================= */
const firebaseConfig={
 apiKey: "AIzaSyCmerraKVr1iJsRoiW53lxUtgDUcOGVXtY",
 authDomain: "ganbaru-sheet-a32f3.firebaseapp.com",
 projectId: "ganbaru-sheet-a32f3"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ================= Tabs ================= */
const ADMIN_PASSWORD = "0000"; // 管理用パスワード

function showTab(id){
 // 設定タブを開く時だけパスワードを求める
 if(id === 'settings') {
  const pass = prompt("管理用パスワードを入力してください:");
  if(pass !== ADMIN_PASSWORD) {
   if(pass !== null) alert("パスワードが違います。");
   return;
  }
 }

 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 event.target.classList.add("active");
}

/* ================= Seed (初回のみ) ================= */
const pastel=["#e0f2fe","#fce7f3","#dcfce7","#fef9c3","#f3e8ff"];
async function seed(){
 const s=await db.collection("settings").get();
 if(!s.empty) return; 
 ["榎本","田中","佐藤"].forEach((n,i)=>db.collection("settings").add({type:"staff",name:n,order:i}));
 ["ひかり","カード","でんき","スマホ"].forEach((n,i)=>db.collection("settings").add({type:"item",name:n,color:pastel[i],order:i}));
}
seed();

/* ================= Data ================= */
let staffList=[],itemList=[],records=[];

const today = new Date();
const dateStr = `${today.getMonth() + 1}/${today.getDate()}`;
document.getElementById('boardTitle').textContent = `${dateStr} のがんばるシート`;

/* Settings realtime */
db.collection("settings").onSnapshot(snap=>{
 staffList=[];itemList=[];
 snap.forEach(d=>{
  const v=d.data();v.id=d.id;
  if(v.type=="staff") staffList.push(v);
  if(v.type=="item") itemList.push(v);
 });
 renderAll();
});

/* Sales realtime */
db.collection("sales").onSnapshot(snap=>{
 records=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderAll();
});

/* ================= UI Render ================= */
const staffSelect=document.getElementById("staffSelect");
const btnContainer=document.getElementById("btnContainer");
const boardTable=document.getElementById("boardTable");
const staffListUI=document.getElementById("staffListUI");
const itemListUI=document.getElementById("itemListUI");

/* Staff Lock */
let lockedStaff=localStorage.getItem("lockedStaff")||"";
function toggleLock(){
 if(lockedStaff){
  lockedStaff="";
  localStorage.removeItem("lockedStaff");
  lockBtn.textContent="🔓 固定OFF";
 }else{
  lockedStaff=staffSelect.value;
  localStorage.setItem("lockedStaff",lockedStaff);
  lockBtn.textContent="🔒 固定ON";
 }
}

function renderAll(){
 staffSelect.innerHTML=staffList.map(s=>`<option>${s.name}</option>`).join("");
 if(lockedStaff){
  staffSelect.value=lockedStaff;
  staffSelect.disabled=true;
  lockBtn.textContent="🔒 固定ON";
 }else{
  staffSelect.disabled=false;
  lockBtn.textContent="🔓 固定OFF";
 }

 btnContainer.innerHTML=itemList.map(it=>`
 <div class="item-box">
  <button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
  <div class="item-footer">
   <span id="count_${it.name}">0件</span>
   <button class="minus" onclick="removeRecord('${it.name}')">−</button>
  </div>
  <div class="rank-mini" id="rank_${it.name}"></div>
 </div>`).join("");

 staffListUI.innerHTML=staffList.map(s=>`
 <div class="setting-row">
  <input value="${s.name}" onchange="editSetting('${s.id}',this.value,null)">
  <button onclick="deleteSetting('${s.id}')">削除</button>
 </div>`).join("");

 itemListUI.innerHTML=itemList.map(it=>`
 <div class="setting-row">
  <input value="${it.name}" onchange="editSetting('${it.id}',this.value,'${it.color}')">
  <input type="color" value="${it.color}" list="paleColors" onchange="editSetting('${it.id}','${it.name}',this.value)">
  <button onclick="deleteSetting('${it.id}')">削除</button>
 </div>`).join("");

 updateCounts();
 renderBoard();
}

/* ================= Sales ================= */
function addRecord(item){
 const staff=lockedStaff||staffSelect.value;
 const date=new Date().toISOString().slice(0,10);
 db.collection("sales").add({staff,item,date});
}
function removeRecord(item){
 const staff=lockedStaff||staffSelect.value;
 const today=new Date().toISOString().slice(0,10);
 const r=records.filter(r=>r.item==item&&r.staff==staff&&r.date==today).pop();
 if(r) db.collection("sales").doc(r.id).delete();
}

/* ================= Counts + Ranking ================= */
function updateCounts(){
 const today=new Date().toISOString().slice(0,10);
 const staff=lockedStaff||staffSelect.value;

 itemList.forEach(it=>{
  const c=records.filter(r=>r.item==it.name&&r.staff==staff&&r.date==today).length;
  document.getElementById("count_"+it.name).textContent=c+"件";

  const rank={};
  records.filter(r=>r.item==it.name&&r.date==today).forEach(r=>{
   rank[r.staff]=(rank[r.staff]||0)+1;
  });
  const sorted=Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,3);
  document.getElementById("rank_"+it.name).innerHTML=sorted.map((r,i)=>`${i+1}位 ${r[0]}:${r[1]}件`).join("<br>");
 });
}

/* ================= Board Table (★修正点：がんばるシート形式) ================= */
function renderBoard(){
 const today=new Date().toISOString().slice(0,10);
 let maxCols = 20;

 // 最大件数を計算して列を伸ばす
 itemList.forEach(it=>{
  const count = records.filter(r=>r.item==it.name&&r.date==today).length;
  if(count > maxCols) maxCols = count;
 });

 let html="<tr><th class='row-header' style='background:#f9fafb;'>商材名</th>";
 for(let i=1; i<=maxCols; i++){
  html+=`<th class='square-cell'>${i}</th>`;
 }
 html+="</tr>";

 itemList.forEach(it=>{
  // 行の左端（商材名）
  html+=`<tr><th class='row-header' style='background:${it.color}; color:#333;'>${it.name}</th>`;
  
  const itemRecords = records.filter(r=>r.item==it.name&&r.date==today);
  
  // 獲得した人の名前を横に並べていく
  for(let i=0; i<maxCols; i++){
   const staffName = itemRecords[i] ? itemRecords[i].staff : '';
   const cellClass = staffName ? 'name-cell' : '';
   html+=`<td class='square ${cellClass}'>${staffName}</td>`;
  }
  html+="</tr>";
 });

 boardTable.innerHTML=html;
}

/* ================= Settings CRUD ================= */
function addStaff(){
 const n=newStaff.value;
 if(n) db.collection("settings").add({type:"staff",name:n,order:Date.now()});
}
function addItem(){
 const n=newItem.value;
 const c=newColor.value;
 if(n) db.collection("settings").add({type:"item",name:n,color:c,order:Date.now()});
}
function editSetting(id,name,color){
 const data={name};
 if(color) data.color=color;
 db.collection("settings").doc(id).update(data);
}
function deleteSetting(id){
 db.collection("settings").doc(id).delete();
}
</script>

</body>
</html>
