<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
/* === 元デザイン完全維持 === */
body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f4f6; }
header{ display:flex; gap:10px; padding:8px; background:white; border-bottom:1px solid #ddd; align-items:center; flex-wrap:wrap; }
.tab{ padding:6px 14px; border-radius:8px; cursor:pointer; background:#e5e7eb; font-weight:bold; color:#64748b;}
.tab.active{background:#2563eb;color:white;}
.date-wrap { margin-left:auto; display:flex; align-items:center; }
#globalDate { font-family:inherit; padding:6px 10px; border:1px solid #cbd5e0; border-radius:8px; font-weight:bold; color:#475569; background:#f8fafc; cursor:pointer; font-size:14px; }

.page{display:none;padding:12px; max-width:1200px; margin:0 auto;}
.page.active{display:block;}

.card{ background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:15px; }
.card h3 { margin-top:0; border-bottom:2px solid #e2e8f0; padding-bottom:8px; color:#334155; margin-bottom:15px; }

.staff-selector { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:bold; color:#475569; }
.staff-selector select { font-size:16px; padding:10px; flex:1; min-width:150px; max-width:300px; border-radius:8px; border:1px solid #cbd5e0; background:#f8fafc; }
#lockBtn { padding:10px 15px; border:1px solid #cbd5e0; background:#f1f5f9; color:#64748b; border-radius:8px; cursor:pointer; font-weight:bold; }
#lockBtn.locked { background:#3b82f6; color:white; }

.items{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.item-box{ border:1px solid #ddd; border-radius:10px; padding:8px; background:white; }
.item-btn{ width:100%; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; color:#000;
 text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 0px 2px 4px rgba(0,0,0,0.2);}
.item-footer{ display:flex; justify-content:space-between; margin-top:6px; font-size:14px; align-items:center;}
.minus{ background:#f1f5f9; border:1px solid #e2e8f0; padding:4px 10px; border-radius:6px; font-weight:bold; cursor:pointer; }
.my-count { font-size:16px; font-weight:bold; color:#475569; }
.rank-mini { font-size:12px; color:#64748b; margin-top:4px; }

.board-wrap{ overflow-x:auto; }
table{ border-collapse:collapse; width:max-content; background:white; }
th,td{ border:1px solid #cbd5e0; padding:4px; text-align:center; font-size:12px; }
.row-header { position:sticky; left:0; z-index:1; font-weight:bold; background:#f8fafc; }
.square{ width:60px; height:60px; font-size:12px; background:#fff; vertical-align:middle; }
.name-cell{ background:#f0f9ff; }

.normal-name{ font-weight:bold; color:#000; }
.handoff-main{ font-weight:bold; color:#dc2626; } 
.handoff-sub{ font-size:10px; color:#64748b; }
.handoff-wrap { display:flex; align-items:center; gap:8px; padding-left:15px; margin-left:5px; border-left:2px solid #cbd5e0; }
.handoff-wrap select { font-size:16px; padding:8px; border-radius:8px; border:1px solid #cbd5e0; background:#f8fafc; }

.settings-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
@media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
.add-form { display:flex; gap:8px; align-items:center; margin-bottom:15px; }
.add-form input[type="text"] { flex:1; min-width:0; padding:10px; border:1px solid #cbd5e0; border-radius:6px; font-size:14px; }
.add-form input[type="color"] { width:45px; height:40px; padding:2px; border:1px solid #cbd5e0; border-radius:6px; cursor:pointer; flex-shrink:0;}
.add-form button { padding:10px 15px; background:#64748b; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; flex-shrink:0;}
.list-ui { list-style:none; padding:0; margin:0; max-height:500px; overflow-y:auto; }
.list-ui li { display:flex; justify-content:space-between; align-items:center; padding:6px 8px; border-bottom:1px solid #edf2f7; background:white; margin-bottom:4px; border-radius:6px; transition:0.2s;}
.drag-handle { cursor: grab; font-size: 18px; color: #94a3b8; padding: 0 4px; user-select: none; }
.drag-handle:active { cursor: grabbing; }
.list-ui li.dragging { opacity: 0.4; background: #f8fafc; border: 1px dashed #cbd5e0; }
.list-ui li.over { border-top: 3px solid #3b82f6; }
.delete-btn { background:#fca5a5; color:#7f1d1d; border:none; padding:8px 12px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:bold; flex-shrink:0;}
.setting-input { flex:1; min-width:50px; padding:8px; border:1px solid #cbd5e0; border-radius:6px; font-weight:bold; }
.color-picker { cursor:pointer; width:40px; height:36px; border:1px solid #cbd5e0; border-radius:4px; padding:2px; flex-shrink:0;}
</style>
</head>

<body>

<header>
 <div class="tab active" onclick="showTab('input', this)">入力</div>
 <div class="tab" onclick="showTab('board', this)">がんばるシート</div>
 <div class="tab" onclick="showTab('settings', this)">設定</div>
 <div class="tab" onclick="showTab('monthly', this)">📊 月次集計</div>
 <div class="date-wrap"><input type="date" id="globalDate" onchange="changeDate(this.value)"></div>
</header>

<div id="input" class="page active">
 <div class="card">
  <div class="staff-selector">
   <label>スタッフ:</label>
   <select id="staffSelect" onchange="updateCounts()"></select>
   <button onclick="toggleLock()" id="lockBtn">🔓 固定OFF</button>
   <div class="handoff-wrap">
    <label><input type="checkbox" id="handoffToggle" onchange="toggleHandoff()"> 引き継ぎ</label>
    <select id="handoffSelect" disabled></select>
   </div>
  </div>
 </div>
 <div class="card"><div class="items" id="btnContainer"></div></div>
</div>

<div id="board" class="page">
 <div class="card">
  <h3 id="boardTitle"></h3>
  <div class="board-wrap"><table id="boardTable"></table></div>
 </div>
</div>

<div id="settings" class="page">
 <div class="settings-grid">
  <div class="card">
   <h3>スタッフ管理</h3>
   <div class="add-form">
    <input type="text" id="newStaff"><button onclick="addStaff()">追加</button>
   </div>
   <div id="staffListUI"></div>
  </div>

  <div class="card">
   <h3>商材管理</h3>
   <div class="add-form">
    <input type="text" id="newItem">
    <input type="color" id="newColor" value="#e0f2fe">
    <button onclick="addItem()">追加</button>
   </div>
   <div id="itemListUI"></div>
  </div>
 </div>
</div>

<div id="monthly" class="page">
 <div class="card">
  <h3>📅 月次集計 商材選択</h3>
  <div id="monthlyItemSelect"></div>
  <button onclick="calculateMonthly()">集計</button>
 </div>
 <div class="card"><div id="monthlyTotal"></div></div>
 <div class="card"><div id="monthlyTop3"></div></div>
 <div class="card"><table id="monthlyTable"></table></div>
 <div class="card"><table id="monthlyItemBoard"></table></div>
</div>

<script>
/* Firebase */
const firebaseConfig={
 apiKey:"AIzaSyCmerraKVr1iJsRoiW53lxUtgDUcOGVXtY",
 authDomain:"ganbaru-sheet-a32f3.firebaseapp.com",
 projectId:"ganbaru-sheet-a32f3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* Globals */
let staffList=[], itemList=[], records=[], monthlyRecords=[];
let lockedStaff = localStorage.getItem("lockedStaff") || "";
const ADMIN_PASSWORD="0000";
let salesUnsubscribe=null;

/* Date */
function getLocalYMD(d){
 return d.toISOString().slice(0,10);
}
let currentDate=getLocalYMD(new Date());
globalDate.value=currentDate;

/* Tabs */
function showTab(id, el){
 if(id==="settings"){
  const p=prompt("管理用パスワード:");
  if(p!==ADMIN_PASSWORD) return alert("NG");
 }
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 el.classList.add("active");
 updateAllViews();
 if(id==="monthly") loadMonthlyData();
}
function changeDate(d){ currentDate=d; loadSalesData(); }

/* Load data */
function loadSalesData(){
 if(salesUnsubscribe) salesUnsubscribe();
 salesUnsubscribe=db.collection("sales").where("date","==",currentDate)
 .onSnapshot(snap=>{
  records=snap.docs.map(d=>({id:d.id,...d.data()}));
  updateAllViews();
 });
}
db.collection("settings").orderBy("order").onSnapshot(snap=>{
 staffList=[]; itemList=[];
 snap.forEach(d=>{
  const v=d.data(); v.id=d.id;
  if(v.type==="staff") staffList.push(v);
  if(v.type==="item") itemList.push(v);
 });
 renderSettingsAndButtons();
});

/* Render */
function updateAllViews(){
 boardTitle.textContent=currentDate.replace(/-/g,"/")+" のがんばるシート";
 updateCounts();
 renderBoard();
}

/* UI render */
function renderSettingsAndButtons(){
 staffSelect.innerHTML=staffList.map(s=>`<option>${s.name}</option>`).join("");
 handoffSelect.innerHTML=staffSelect.innerHTML;
 btnContainer.innerHTML=itemList.map(it=>`
  <div class="item-box">
   <button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
   <div class="item-footer">
    <div>
     <span class="my-count" id="count_${it.name}">0件</span>
     <div class="rank-mini" id="rank_${it.name}"></div>
    </div>
    <button class="minus" onclick="removeRecord('${it.name}')">取消</button>
   </div>
  </div>`).join("");
}

/* Lock */
function toggleLock(){
 if(lockedStaff){ lockedStaff=""; localStorage.removeItem("lockedStaff"); }
 else { lockedStaff=staffSelect.value; localStorage.setItem("lockedStaff",lockedStaff); }
}

/* Handoff */
function toggleHandoff(){ handoffSelect.disabled=!handoffToggle.checked; }

/* Count */
function updateCounts(){
 const s=lockedStaff||staffSelect.value;
 itemList.forEach(it=>{
  const c=records.filter(r=>r.item===it.name&&r.staff===s).length;
  count_${it.name}.textContent=c+"件";
 });
}

/* Add */
function addRecord(item){
 const base=lockedStaff||staffSelect.value;
 if(!base) return alert("スタッフ未選択");
 const isH=handoffToggle.checked;
 const staff=isH?handoffSelect.value:base;
 const registrar=isH?base:"";
 const gid=Date.now().toString();
 db.collection("sales").add({staff,registrar,item,date:currentDate,groupId:gid});
}

/* Remove */
function removeRecord(item){
 const s=lockedStaff||staffSelect.value;
 const r=records.filter(x=>x.item===item&&x.staff===s).pop();
 if(!r) return;
 records.filter(x=>x.groupId===r.groupId).forEach(x=>db.collection("sales").doc(x.id).delete());
}

/* Board */
function groupBy(a){
 const m={}; a.forEach(r=>{ if(!m[r.groupId]) m[r.groupId]=[]; m[r.groupId].push(r); });
 return Object.values(m);
}
function renderBoard(){
 let max=20;
 itemList.forEach(it=>{
  const g=groupBy(records.filter(r=>r.item===it.name));
  if(g.length>max) max=g.length;
 });
 let html="<tr><th>商材</th><th>合計</th>";
 for(let i=1;i<=max;i++) html+=`<th>${i}</th>`;
 html+="</tr>";
 itemList.forEach(it=>{
  const groups=groupBy(records.filter(r=>r.item===it.name));
  html+=`<tr><th>${it.name}</th><td>${groups.length}件</td>`;
  for(let i=0;i<max;i++){
   if(!groups[i]){ html+="<td class='square'></td>"; continue;}
   const g=groups[i][0];
   if(!g.registrar) html+=`<td class='square name-cell'><div class="normal-name">${g.staff}</div></td>`;
   else html+=`<td class='square name-cell'><div class="handoff-main">成：${g.staff}</div><div class="handoff-sub">${g.registrar}</div></td>`;
  }
  html+="</tr>";
 });
 boardTable.innerHTML=html;
}

/* Settings CRUD */
function addStaff(){ if(newStaff.value) db.collection("settings").add({type:"staff",name:newStaff.value,order:Date.now()}); newStaff.value=""; }
function addItem(){ if(newItem.value) db.collection("settings").add({type:"item",name:newItem.value,color:newColor.value,order:Date.now()}); newItem.value=""; }

/* Monthly */
function getMonthRange(d){
 const dt=new Date(d+"T00:00:00");
 const y=dt.getFullYear(), m=dt.getMonth();
 return {start:new Date(y,m,1).toISOString().slice(0,10), end:new Date(y,m+1,0).toISOString().slice(0,10)};
}
async function loadMonthlyData(){
 const {start,end}=getMonthRange(currentDate);
 const snap=await db.collection("sales").where("date",">=",start).where("date","<=",end).get();
 monthlyRecords=snap.docs.map(d=>d.data());
}

/* Start */
loadSalesData();
</script>

</body>
</html>
