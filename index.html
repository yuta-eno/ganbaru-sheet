<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
:root{
 --glass-bg: rgba(255,255,255,0.18);
 --glass-border: rgba(255,255,255,0.3);
 --blur: 20px;
 --bg: linear-gradient(135deg,#667eea,#764ba2);
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;}
body{
 margin:0;
 background:var(--bg);
 color:white;
 height:100vh;
 display:flex;
 flex-direction:column;
 overflow:hidden;
}

header{
 padding:14px 20px;
 font-size:22px;
 font-weight:600;
 backdrop-filter: blur(var(--blur));
 background: var(--glass-bg);
 border-bottom:1px solid var(--glass-border);
}

.dashboard{
 display:grid;
 grid-template-columns: 2fr 1fr;
 gap:16px;
 padding:16px;
 height:100%;
}

.card{
 background:var(--glass-bg);
 backdrop-filter: blur(var(--blur));
 border:1px solid var(--glass-border);
 border-radius:22px;
 padding:16px;
 box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.big-title{
 font-size:26px;
 font-weight:700;
 margin-bottom:10px;
}

.items{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
 gap:12px;
}

.item-box{
 background:rgba(0,0,0,.25);
 border-radius:18px;
 padding:8px;
}

.item-btn{
 width:100%;
 border-radius:14px;
 padding:16px;
 font-size:20px;
 font-weight:600;
 color:white;
 border:none;
 cursor:pointer;
 backdrop-filter: blur(8px);
 box-shadow:0 10px 20px rgba(0,0,0,.25);
 transition:0.15s;
}
.item-btn:active{transform:scale(.95);}

.item-footer{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:16px;
 padding:6px 6px 0;
}

.minus{
 background:#ef4444;
 border:none;
 color:white;
 padding:4px 10px;
 border-radius:10px;
 font-size:16px;
 cursor:pointer;
}

.counter{
 font-size:50px;
 font-weight:700;
}

.rank-list li{
 font-size:20px;
 padding:6px 0;
}
</style>
</head>

<body>

<header>📊 GANBARU SHEET PRO Dashboard</header>

<div class="dashboard">

<!-- 左：入力 -->
<div class="card">
 <div class="big-title">商材タップで成約登録</div>
 <select id="staffSelect" style="font-size:20px;padding:8px;border-radius:10px;border:none;"></select>
 <div class="items" id="btnContainer"></div>
</div>

<!-- 右：ダッシュボード -->
<div class="card">
 <div class="big-title">本日の成約数</div>
 <div id="todayCount" class="counter">0</div>

 <div class="big-title" style="margin-top:20px;">月間ランキング</div>
 <ul id="rankingUI" class="rank-list"></ul>
</div>

</div>

<script>
/* ================= Firebase ================= */
const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* DOM */
const staffSelect=document.getElementById("staffSelect");
const btnContainer=document.getElementById("btnContainer");
const todayCountUI=document.getElementById("todayCount");
const rankingUI=document.getElementById("rankingUI");

/* 初期色 */
const pastel=["#60a5fa","#a78bfa","#34d399","#fbbf24","#f472b6","#38bdf8"];

/* Seed */
async function seed(){
 const s=await db.collection("settings").get();
 if(!s.empty) return;
 ["榎本","田中","佐藤"].forEach((n,i)=>{
  db.collection("settings").doc("staff_"+i).set({type:"staff",name:n,order:i});
 });
 ["ひかり","カード","でんき","スマホ"].forEach((n,i)=>{
  db.collection("settings").doc("item_"+i).set({type:"item",name:n,color:pastel[i],order:i});
 });
}
seed();

/* 設定 */
let staffList=[], itemList=[];
db.collection("settings").onSnapshot(snap=>{
 staffList=[]; itemList=[];
 snap.forEach(d=>{
  const v=d.data();
  if(v.type=="staff") staffList.push(v);
  if(v.type=="item") itemList.push(v);
 });
 renderUI();
});

/* レコード */
let records=[];
db.collection("sales").onSnapshot(snap=>{
 records=snap.docs.map(d=>({id:d.id,...d.data()}));
 updateCounts();
});

/* UI生成 */
function renderUI(){
 staffSelect.innerHTML=staffList.sort((a,b)=>a.order-b.order)
  .map(s=>`<option>${s.name}</option>`).join("");

 btnContainer.innerHTML=itemList.sort((a,b)=>a.order-b.order).map(it=>`
 <div class="item-box">
  <button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
  <div class="item-footer">
   <span id="count_${it.name}">0件</span>
   <button class="minus" onclick="removeRecord('${it.name}')">−</button>
  </div>
 </div>
 `).join("");
}

/* 成約追加 */
function addRecord(item){
 const staff=staffSelect.value;
 const now=new Date();
 const date=now.toISOString().slice(0,10);
 const month=now.getFullYear()+"-"+(now.getMonth()+1);

 db.collection("sales").add({
  staff,item,date,month,
  time:firebase.firestore.FieldValue.serverTimestamp()
 });
}

/* 成約削除（最後の1件） */
function removeRecord(item){
 const staff=staffSelect.value;
 const today=new Date().toISOString().slice(0,10);
 const target=records.filter(r=>r.item==item && r.staff==staff && r.date==today).pop();
 if(target){
  db.collection("sales").doc(target.id).delete();
 }
}

/* カウント更新 */
function updateCounts(){
 const today=new Date().toISOString().slice(0,10);
 let todayTotal=0;
 const rank={};

 itemList.forEach(it=>{
  const staff=staffSelect.value;
  const c=records.filter(r=>r.item==it.name && r.staff==staff && r.date==today).length;
  const el=document.getElementById("count_"+it.name);
  if(el) el.textContent=c+"件";
 });

 records.forEach(r=>{
  if(r.date==today) todayTotal++;
  rank[r.staff]=(rank[r.staff]||0)+1;
 });

 todayCountUI.textContent=todayTotal;
 const sorted=Object.entries(rank).sort((a,b)=>b[1]-a[1]);
 rankingUI.innerHTML=sorted.map((r,i)=>`<li>${i+1}位 ${r[0]}：${r[1]}件</li>`).join("");
}

/* スタッフ切替時も再計算 */
staffSelect.addEventListener("change",updateCounts);
</script>

</body>
</html>
