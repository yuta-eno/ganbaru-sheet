<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GANBARU SHEET PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
:root{
 --glass-bg: rgba(255,255,255,0.18);
 --glass-border: rgba(255,255,255,0.3);
 --blur: 20px;
 --bg: linear-gradient(135deg,#667eea,#764ba2);
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;}
body{
 margin:0;
 background:var(--bg);
 color:white;
 height:100vh;
 display:flex;
 flex-direction:column;
 overflow:hidden;
}

header{
 padding:12px 16px;
 display:flex;
 gap:12px;
 backdrop-filter: blur(var(--blur));
 background: var(--glass-bg);
 border-bottom:1px solid var(--glass-border);
}

.tab{
 padding:8px 16px;
 border-radius:12px;
 background:rgba(255,255,255,0.2);
 cursor:pointer;
}
.tab.active{background:white;color:black;font-weight:600;}

.page{display:none;padding:16px;height:100%;overflow:auto;}
.page.active{display:block;}

.card{
 background:var(--glass-bg);
 backdrop-filter: blur(var(--blur));
 border:1px solid var(--glass-border);
 border-radius:22px;
 padding:16px;
 box-shadow:0 20px 40px rgba(0,0,0,.25);
 margin-bottom:16px;
}

.big-title{font-size:22px;font-weight:700;margin-bottom:10px;}

.items{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
 gap:12px;
}

.item-box{
 background:rgba(0,0,0,.25);
 border-radius:18px;
 padding:8px;
}

.item-btn{
 width:100%;
 border-radius:14px;
 padding:16px;
 font-size:20px;
 font-weight:600;
 color:white;
 border:none;
 cursor:pointer;
 backdrop-filter: blur(8px);
 box-shadow:0 10px 20px rgba(0,0,0,.25);
}
.item-btn:active{transform:scale(.95);}

.item-footer{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:16px;
 padding:6px 6px 0;
}

.minus{
 background:#ef4444;
 border:none;
 color:white;
 padding:4px 10px;
 border-radius:10px;
 font-size:16px;
 cursor:pointer;
}

.counter{font-size:28px;font-weight:700;}
.rank-list li{font-size:18px;padding:4px 0;}
</style>
</head>

<body>

<header>
 <div class="tab active" onclick="showTab('input')">入力</div>
 <div class="tab" onclick="showTab('board')">ボード</div>
 <div class="tab" onclick="showTab('settings')">設定</div>
</header>

<!-- ================= 入力 ================= -->
<div id="input" class="page active">
 <div class="card">
  <div class="big-title">スタッフ選択</div>
  <select id="staffSelect" style="font-size:20px;padding:8px;border-radius:10px;border:none;"></select>
 </div>

 <div class="card">
  <div class="big-title">商材タップで成約登録</div>
  <div class="items" id="btnContainer"></div>
 </div>
</div>

<!-- ================= ボード ================= -->
<div id="board" class="page">
 <div class="card">
  <div class="big-title">本日の商材別成約数</div>
  <div id="todayItems"></div>
 </div>

 <div class="card">
  <div class="big-title">月間スタッフランキング（商材別）</div>
  <select id="rankItemSelect"></select>
  <ul id="rankingUI" class="rank-list"></ul>
 </div>
</div>

<!-- ================= 設定 ================= -->
<div id="settings" class="page">
 <div class="card">
  <div class="big-title">スタッフ追加</div>
  <input id="newStaff" placeholder="名前">
  <button onclick="addStaff()">追加</button>
 </div>

 <div class="card">
  <div class="big-title">商材追加</div>
  <input id="newItem" placeholder="商材名">
  <input type="color" id="newColor">
  <button onclick="addItem()">追加</button>
 </div>
</div>

<script>
/* ================= Firebase ================= */
const firebaseConfig = {
 apiKey:"YOUR_API_KEY",
 authDomain:"YOUR_PROJECT.firebaseapp.com",
 projectId:"YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* ================= Tab ================= */
function showTab(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 event.target.classList.add("active");
}

/* ================= Seed ================= */
const pastel=["#60a5fa","#a78bfa","#34d399","#fbbf24","#f472b6","#38bdf8"];

async function seed(){
 const s=await db.collection("settings").get();
 if(!s.empty) return;
 ["榎本","田中","佐藤"].forEach((n,i)=>{
  db.collection("settings").doc("staff_"+i).set({type:"staff",name:n,order:i});
 });
 ["ひかり","カード","でんき","スマホ"].forEach((n,i)=>{
  db.collection("settings").doc("item_"+i).set({type:"item",name:n,color:pastel[i],order:i});
 });
}
seed();

/* ================= Settings Load ================= */
let staffList=[], itemList=[];
db.collection("settings").onSnapshot(snap=>{
 staffList=[]; itemList=[];
 snap.forEach(d=>{
  const v=d.data();
  if(v.type=="staff") staffList.push(v);
  if(v.type=="item") itemList.push(v);
 });
 renderUI();
});

/* ================= Records ================= */
let records=[];
db.collection("sales").onSnapshot(snap=>{
 records=snap.docs.map(d=>({id:d.id,...d.data()}));
 updateCounts();
});

/* ================= UI Render ================= */
const staffSelect=document.getElementById("staffSelect");
const btnContainer=document.getElementById("btnContainer");
const todayItems=document.getElementById("todayItems");
const rankItemSelect=document.getElementById("rankItemSelect");
const rankingUI=document.getElementById("rankingUI");

function renderUI(){
 staffSelect.innerHTML=staffList.map(s=>`<option>${s.name}</option>`).join("");

 btnContainer.innerHTML=itemList.map(it=>`
 <div class="item-box">
  <button class="item-btn" style="background:${it.color}" onclick="addRecord('${it.name}')">${it.name}</button>
  <div class="item-footer">
   <span id="count_${it.name}">0件</span>
   <button class="minus" onclick="removeRecord('${it.name}')">−</button>
  </div>
 </div>`).join("");

 rankItemSelect.innerHTML=itemList.map(it=>`<option>${it.name}</option>`).join("");
}

/* ================= Add / Remove ================= */
function addRecord(item){
 const staff=staffSelect.value;
 const now=new Date();
 const date=now.toISOString().slice(0,10);
 const month=now.getFullYear()+"-"+(now.getMonth()+1);
 db.collection("sales").add({staff,item,date,month,time:firebase.firestore.FieldValue.serverTimestamp()});
}

function removeRecord(item){
 const staff=staffSelect.value;
 const today=new Date().toISOString().slice(0,10);
 const target=records.filter(r=>r.item==item&&r.staff==staff&&r.date==today).pop();
 if(target) db.collection("sales").doc(target.id).delete();
}

/* ================= Counts ================= */
function updateCounts(){
 const today=new Date().toISOString().slice(0,10);
 const month=new Date().getFullYear()+"-"+(new Date().getMonth()+1);
 const staff=staffSelect.value;

 // 個人商材カウント
 itemList.forEach(it=>{
  const c=records.filter(r=>r.item==it.name&&r.staff==staff&&r.date==today).length;
  const el=document.getElementById("count_"+it.name);
  if(el) el.textContent=c+"件";
 });

 // 本日商材別合計
 let html="";
 itemList.forEach(it=>{
  const c=records.filter(r=>r.item==it.name&&r.date==today).length;
  html+=`<div class="counter">${it.name}: ${c}件</div>`;
 });
 todayItems.innerHTML=html;

 // ランキング（商材別）
 const item=rankItemSelect.value;
 const rank={};
 records.filter(r=>r.item==item&&r.month==month).forEach(r=>{
  rank[r.staff]=(rank[r.staff]||0)+1;
 });
 const sorted=Object.entries(rank).sort((a,b)=>b[1]-a[1]);
 rankingUI.innerHTML=sorted.map((r,i)=>`<li>${i+1}位 ${r[0]}：${r[1]}件</li>`).join("");
}

staffSelect.addEventListener("change",updateCounts);
rankItemSelect.addEventListener("change",updateCounts);

/* ================= Settings Add ================= */
function addStaff(){
 const n=document.getElementById("newStaff").value;
 if(!n) return;
 db.collection("settings").add({type:"staff",name:n,order:Date.now()});
}

function addItem(){
 const n=document.getElementById("newItem").value;
 const c=document.getElementById("newColor").value;
 if(!n) return;
 db.collection("settings").add({type:"item",name:n,color:c,order:Date.now()});
}
</script>

</body>
</html>
